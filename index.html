<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MPKP Ltd — Building Trust, Delivering Quality</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f1117; --bg2: #161b27; --bg3: #1e2535; --bg4: #252d40;
  --border: rgba(255,255,255,0.08); --border2: rgba(255,255,255,0.14);
  --text: #e8eaf0; --text2: #8b90a0; --text3: #555c70;
  --accent: #4f8ef7; --accent2: #3a7ae8; --green: #22c87a; --green2: #1aad68;
  --amber: #f59e0b; --red: #ef4444; --teal: #14b8a6; --radius: 10px; --radius-lg: 14px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; }

/* LOGIN */
#login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; }
.login-box { background: var(--bg2); border: 1px solid var(--border2); border-radius: 20px; padding: 2.5rem; width: 100%; max-width: 400px; }
.login-logo { font-size: 22px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
.login-logo span { color: var(--accent); }
.login-sub { color: var(--text2); font-size: 13px; margin-bottom: 2rem; }
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 12px; color: var(--text2); margin-bottom: 6px; font-weight: 500; }
.form-group select, .form-group input { width: 100%; background: var(--bg3); border: 1px solid var(--border2); border-radius: var(--radius); padding: 10px 12px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14px; outline: none; transition: border-color 0.2s; }
.form-group select:focus, .form-group input:focus { border-color: var(--accent); }
.form-group select option { background: var(--bg3); }
.btn-primary { width: 100%; background: var(--accent); color: #fff; border: none; border-radius: var(--radius); padding: 11px; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer; }
.btn-primary:hover { background: var(--accent2); }

/* LAYOUT */
#app { display: none; min-height: 100vh; }
.topbar { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 0 1.5rem; display: flex; align-items: center; height: 56px; gap: 16px; position: sticky; top: 0; z-index: 100; }
.topbar-logo { font-size: 16px; font-weight: 600; }
.topbar-logo span { color: var(--accent); }
.topbar-user { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.user-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: #fff; }
.user-name { font-size: 13px; color: var(--text2); }
.logout-btn { background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 5px 12px; color: var(--text2); font-size: 12px; cursor: pointer; }
.logout-btn:hover { color: var(--text); }

.main { display: flex; }
.sidebar { width: 220px; min-height: calc(100vh - 56px); background: var(--bg2); border-right: 1px solid var(--border); padding: 1rem 0; flex-shrink: 0; }
.nav-section { padding: 0 12px; margin-bottom: 1.5rem; }
.nav-section-label { font-size: 10px; color: var(--text3); font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; padding: 0 8px; margin-bottom: 6px; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: var(--radius); cursor: pointer; color: var(--text2); font-size: 13px; font-weight: 400; transition: all 0.15s; margin-bottom: 2px; }
.nav-item:hover { background: var(--bg3); color: var(--text); }
.nav-item.active { background: rgba(79,142,247,0.12); color: var(--accent); }
.nav-icon { font-size: 16px; width: 18px; text-align: center; }
.content { flex: 1; padding: 1.5rem; overflow: auto; }

/* MOBILE BOTTOM NAV */
.mobile-nav { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg2); border-top: 1px solid var(--border2); z-index: 200; padding: 6px 0 8px; }
.mobile-nav-items { display: flex; justify-content: space-around; align-items: center; }
.mnav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 8px; cursor: pointer; color: var(--text3); font-size: 10px; font-weight: 500; border-radius: 8px; min-width: 48px; transition: color 0.15s; }
.mnav-item .mni { font-size: 20px; line-height: 1; }
.mnav-item.active { color: var(--accent); }
.mnav-item:active { background: var(--bg3); }

/* CARDS */
.page { display: none; }
.page.active { display: block; }
.page-title { font-size: 20px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
.page-sub { font-size: 13px; color: var(--text2); margin-bottom: 1.5rem; }
.card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1.25rem; margin-bottom: 1rem; }
.card-title { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 1rem; display: flex; align-items: center; gap: 8px; }
.card-title .ct-icon { font-size: 16px; }

/* STATS */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr)); gap: 12px; margin-bottom: 1.5rem; }
.stat { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1rem 1.25rem; }
.stat-label { font-size: 11px; color: var(--text2); font-weight: 500; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
.stat-val { font-size: 26px; font-weight: 600; color: var(--text); letter-spacing: -0.5px; line-height: 1; }
.stat-sub { font-size: 11px; color: var(--text3); margin-top: 4px; }
.stat.green .stat-val { color: var(--green); }
.stat.amber .stat-val { color: var(--amber); }
.stat.red .stat-val { color: var(--red); }
.stat.blue .stat-val { color: var(--accent); }

/* FORMS */
.form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px,1fr)); gap: 12px; margin-bottom: 14px; }
.field label { display: block; font-size: 11px; color: var(--text2); margin-bottom: 5px; font-weight: 500; }
.field input, .field select, .field textarea { width: 100%; background: var(--bg3); border: 1px solid var(--border2); border-radius: var(--radius); padding: 9px 11px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 13px; outline: none; transition: border-color 0.2s; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
.field select option { background: var(--bg3); }
.field textarea { resize: vertical; min-height: 70px; }
.btn-save { background: var(--green); color: #fff; border: none; border-radius: var(--radius); padding: 10px 20px; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; }
.btn-save:hover { background: var(--green2); }
.btn-secondary { background: var(--bg3); color: var(--text2); border: 1px solid var(--border2); border-radius: var(--radius); padding: 10px 16px; font-family: 'DM Sans', sans-serif; font-size: 13px; cursor: pointer; }

/* TABLE */
.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.data-table th { text-align: left; padding: 8px 12px; color: var(--text3); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid var(--border); }
.data-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); color: var(--text2); vertical-align: middle; }
.data-table tr:last-child td { border-bottom: none; }
.data-table tr:hover td { background: var(--bg3); color: var(--text); }
.badge { display: inline-block; font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 20px; }
.badge-green { background: rgba(34,200,122,0.12); color: var(--green); }
.badge-amber { background: rgba(245,158,11,0.12); color: var(--amber); }
.badge-red { background: rgba(239,68,68,0.12); color: var(--red); }
.badge-blue { background: rgba(79,142,247,0.12); color: var(--accent); }
.badge-gray { background: var(--bg3); color: var(--text2); }
.empty-state { text-align: center; padding: 2.5rem; color: var(--text3); font-size: 13px; }
.empty-state .es-icon { font-size: 32px; margin-bottom: 8px; opacity: 0.4; }

/* TOAST */
.toast { position: fixed; bottom: 80px; right: 16px; background: var(--bg3); border: 1px solid var(--border2); border-radius: var(--radius-lg); padding: 12px 18px; font-size: 13px; color: var(--text); z-index: 999; display: none; align-items: center; gap: 10px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
.toast.show { display: flex; }
.toast-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); flex-shrink: 0; }

/* INVENTORY ALERT */
.alert-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: rgba(239,68,68,0.07); border: 1px solid rgba(239,68,68,0.2); border-radius: var(--radius); margin-bottom: 8px; font-size: 13px; }
.alert-icon { color: var(--red); font-size: 16px; }

/* BAR CHART */
.bar-chart { display: flex; align-items: flex-end; gap: 8px; height: 120px; margin-top: 12px; }
.bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; height: 100%; justify-content: flex-end; }
.bar { width: 100%; border-radius: 4px 4px 0 0; background: var(--accent); transition: height 0.3s ease; min-height: 4px; }
.bar-label { font-size: 10px; color: var(--text3); white-space: nowrap; }
.bar-val { font-size: 11px; color: var(--text2); font-weight: 500; }

/* ATTENDANCE GRID */
.att-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px,1fr)); gap: 10px; }
.att-worker { background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; display: flex; align-items: center; gap: 10px; }
.att-avatar { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: #fff; flex-shrink: 0; }
.att-name { font-size: 12px; font-weight: 500; color: var(--text); }
.att-status { font-size: 11px; margin-top: 2px; }

/* PASSWORD ROWS */
.pw-row { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); flex-wrap:wrap; }
.pw-row:last-child { border-bottom:none; }
.pw-name { min-width:130px; font-size:13px; color:var(--text); font-weight:500; }
.pw-role { font-size:11px; color:var(--text3); }

/* DELETE BUTTON */
.btn-del { background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.25); border-radius:7px; padding:4px 10px; color:var(--red); font-size:11px; cursor:pointer; font-family:'DM Sans',sans-serif; white-space:nowrap; }

/* TABS */
.tabs { display: flex; gap: 4px; background: var(--bg3); border-radius: var(--radius); padding: 4px; margin-bottom: 1.25rem; width: fit-content; }
.tab { padding: 6px 14px; border-radius: 7px; font-size: 12px; font-weight: 500; cursor: pointer; color: var(--text2); transition: all 0.15s; }
.tab.active { background: var(--bg2); color: var(--text); border: 1px solid var(--border2); }

/* MOBILE */
@media (max-width: 640px) {
  .sidebar { display: none !important; }
  .mobile-nav { display: block; }
  .topbar { padding: 0 1rem; }
  .topbar .user-name { display: none; }
  .content { padding: 1rem; padding-bottom: 80px; }
  .stats-grid { grid-template-columns: 1fr 1fr; }
  .form-row { grid-template-columns: 1fr; }
  .data-table { font-size: 12px; }
  .data-table th, .data-table td { padding: 7px 8px; }
  .toast { bottom: 90px; right: 12px; left: 12px; }
  .pw-row { flex-direction: column; align-items: flex-start; }
  .pw-row input { width: 100%; }
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">MPKP<span> Ltd</span></div>
    <div class="login-sub" style="color:var(--accent);font-style:italic;font-size:14px">Building Trust, Delivering Quality</div>
    <div style="background:rgba(79,142,247,0.07);border:1px solid rgba(79,142,247,0.2);border-radius:8px;padding:8px 12px;font-size:11px;color:var(--text2);margin-bottom:16px">🏭 Adhesive material specialists — Di-cuts, Masking Tape, Aluminium Foil Tape</div>
    <div class="form-group">
      <label>SELECT YOUR ROLE</label>
      <select id="login-role">
        <option value="">-- Choose role --</option>
        <option value="manager">Admin</option>
        <option value="supervisor">Supervisor</option>
        <option value="grn">Dispatch Inspector</option>
      </select>
    </div>
    <div class="form-group" id="login-name-group" style="display:none">
      <label>YOUR NAME</label>
      <select id="login-name"><option value="">-- Select --</option></select>
    </div>
    <div class="form-group" id="login-pw-group" style="display:none">
      <label>PASSWORD</label>
      <input type="password" id="login-pw" placeholder="Enter your password" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <div id="login-err" style="color:var(--red);font-size:12px;margin-bottom:8px;display:none">❌ Wrong password. Try again.</div>
    <button class="btn-primary" onclick="doLogin()" style="margin-top:8px">Enter App</button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <div class="topbar-logo">MPKP<span> Ltd</span></div>
    <div class="topbar-user">
      <div class="user-avatar" id="tb-avatar">?</div>
      <div class="user-name" id="tb-name">User</div>
      <button class="logout-btn" onclick="doLogout()">Logout</button>
    </div>
  </div>
  <div class="main">
    <div class="sidebar" id="sidebar"></div>
    <div class="content" id="content"></div>
  </div>
  <!-- MOBILE BOTTOM NAV -->
  <nav class="mobile-nav" id="mobile-nav">
    <div class="mobile-nav-items" id="mobile-nav-items"></div>
  </nav>
</div>

<div class="toast" id="toast"><div class="toast-dot"></div><span id="toast-msg">Saved!</span></div>

<!-- Firebase SDK — must load before app script -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// ===================== FIREBASE CONFIG =====================
// 🔧 YOUR FIREBASE PROJECT CONFIG (from firebase console)
const firebaseConfig = {
  apiKey: "AIzaSyAwHyR9riUSav5TYuzmFnKw84ZUB5l0cCs",
  authDomain: "worktrack-630af.firebaseapp.com",
  projectId: "worktrack-630af",
  storageBucket: "worktrack-630af.firebasestorage.app",
  messagingSenderId: "262863331596",
  appId: "1:262863331596:web:a68ec14823475ef6a5a929"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const APP_DOC   = db.collection('appdata').doc('main');
const PW_DOC    = db.collection('appdata').doc('passwords');

// ===================== DATA STORE =====================
const DEFAULT_DATA = {
  workers: [
    {id:'W1',name:'Amit Sharma',team:'A',skill:'Assembly'},
    {id:'W2',name:'Priya Patel',team:'A',skill:'Quality Check'},
    {id:'W3',name:'Ravi Kumar',team:'B',skill:'Packaging'},
    {id:'W4',name:'Sunita Verma',team:'B',skill:'Assembly'},
    {id:'W5',name:'Deepak Singh',team:'C',skill:'Welding'},
    {id:'W6',name:'Kavita Nair',team:'C',skill:'Painting'},
  ],
  supervisors: [
    {id:'S1',name:'James Torres',team:'A'},
    {id:'S2',name:'Sara Patel',team:'B'},
    {id:'S3',name:'Rob Lee',team:'C'},
  ],
  inventory: [
    {id:'I1',item:'Steel Rods',stock:200,unit:'kg',minLevel:50},
    {id:'I2',item:'Paint (Blue)',stock:80,unit:'ltr',minLevel:20},
    {id:'I3',item:'Bolts M10',stock:500,unit:'pcs',minLevel:100},
    {id:'I4',item:'Welding Wire',stock:30,unit:'kg',minLevel:25},
    {id:'I5',item:'Safety Gloves',stock:40,unit:'pcs',minLevel:15},
  ],
  grn_officers: [{id:'G1',name:'Neha Joshi'}],
  clients: ['Tata Motors','Motherson','Suntake'],
  parts: [
    {id:'P1',name:'Di-Cut',price:0},
    {id:'P2',name:'Masking Tape',price:0},
    {id:'P3',name:'Aluminium Foil Tape',price:0},
  ],
  attendance: [], worklog: [], inventory_usage: [], grn_receipts: [], queries: [], broadcasts: [],
};

const DEFAULT_PASSWORDS = {
  'manager:Karen Mills': 'manager123',
  'supervisor:James Torres': 'teamA123',
  'supervisor:Sara Patel': 'teamB123',
  'supervisor:Rob Lee': 'teamC123',
  'grn:Neha Joshi': 'grn123',
};

// In-memory cache (refreshed on every getData() call)
let _dataCache = null;
let _pwCache = null;

async function loadData() {
  const snap = await APP_DOC.get();
  if (snap.exists) {
    _dataCache = snap.data();
  } else {
    // First run — seed defaults
    await APP_DOC.set(DEFAULT_DATA);
    _dataCache = JSON.parse(JSON.stringify(DEFAULT_DATA));
  }
  return _dataCache;
}

async function saveData(d) {
  _dataCache = d;
  await APP_DOC.set(d);
}

// getData() is now async everywhere it's called
async function getData() { return await loadData(); }

async function loadPasswords() {
  const snap = await PW_DOC.get();
  if (snap.exists) {
    _pwCache = snap.data();
  } else {
    await PW_DOC.set(DEFAULT_PASSWORDS);
    _pwCache = JSON.parse(JSON.stringify(DEFAULT_PASSWORDS));
  }
  return _pwCache;
}

async function savePasswords(p) {
  _pwCache = p;
  await PW_DOC.set(p);
}

async function getPasswords() { return await loadPasswords(); }

async function checkPassword(role, name, pw) {
  const passwords = await getPasswords();
  return passwords[`${role}:${name}`] === pw;
}

// Loading overlay helpers
function showLoading(msg) {
  let el = document.getElementById('fb-loading');
  if (!el) {
    el = document.createElement('div');
    el.id = 'fb-loading';
    el.style.cssText = 'position:fixed;inset:0;background:rgba(15,17,23,0.85);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;gap:12px';
    el.innerHTML = '<div style="width:32px;height:32px;border:3px solid #4f8ef7;border-top-color:transparent;border-radius:50%;animation:spin 0.7s linear infinite"></div><div style="color:#8b90a0;font-size:13px;font-family:DM Sans,sans-serif"></div>';
    if (!document.getElementById('spin-style')) {
      const s = document.createElement('style');
      s.id = 'spin-style';
      s.textContent = '@keyframes spin{to{transform:rotate(360deg)}}';
      document.head.appendChild(s);
    }
    document.body.appendChild(el);
  }
  el.querySelector('div:last-child').textContent = msg || 'Loading…';
  el.style.display = 'flex';
}
function hideLoading() {
  const el = document.getElementById('fb-loading');
  if (el) el.style.display = 'none';
}

let currentUser = null;

// ===================== LOGIN =====================
document.getElementById('login-role').addEventListener('change', async function() {
  const grp = document.getElementById('login-name-group');
  const pwGrp = document.getElementById('login-pw-group');
  const sel = document.getElementById('login-name');
  if (!this.value) { grp.style.display='none'; pwGrp.style.display='none'; return; }
  showLoading('Loading…');
  const d = await getData();
  hideLoading();
  grp.style.display='block'; pwGrp.style.display='none';
  sel.innerHTML = '<option value="">-- Select --</option>';
  if (this.value === 'manager') {
    sel.innerHTML += '<option value="manager:Karen Mills">Karen Mills (Admin)</option>';
  } else if (this.value === 'grn') {
    (d.grn_officers||[]).forEach(g => {
      sel.innerHTML += `<option value="grn:${g.name}">${g.name} (Dispatch Inspector)</option>`;
    });
  } else {
    d.supervisors.forEach(s => {
      sel.innerHTML += `<option value="supervisor:${s.name}:${s.team}">${s.name} — Team ${s.team}</option>`;
    });
  }
});

document.getElementById('login-name').addEventListener('change', function() {
  document.getElementById('login-err').style.display = 'none';
  const pwGrp = document.getElementById('login-pw-group');
  if (this.value) { pwGrp.style.display='block'; document.getElementById('login-pw').value=''; }
  else pwGrp.style.display='none';
});

async function doLogin() {
  const role = document.getElementById('login-role').value;
  const nameVal = document.getElementById('login-name').value;
  const pw = document.getElementById('login-pw').value;
  const errEl = document.getElementById('login-err');
  if (!role || !nameVal) { alert('Please select role and name.'); return; }
  if (!pw) { alert('Please enter your password.'); return; }
  showLoading('Verifying…');
  const parts = nameVal.split(':');
  const name = parts[1];
  const ok = await checkPassword(parts[0], name, pw);
  hideLoading();
  if (!ok) {
    errEl.style.display = 'block';
    document.getElementById('login-pw').value = '';
    return;
  }
  errEl.style.display = 'none';
  currentUser = { role: parts[0], name, team: parts[2] || null };
  // Resolve supervisor company
  if (currentUser.role === 'supervisor') {
    const d2 = await getData();
    const supRec = d2.supervisors.find(s=>s.name===currentUser.name);
    currentUser.company = supRec?.company || '';
  }
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('tb-name').textContent = currentUser.name;
  document.getElementById('tb-avatar').textContent = currentUser.name.split(' ').map(w=>w[0]).join('').slice(0,2);
  buildSidebar();
  showPage(currentUser.role === 'manager' ? 'dashboard' : currentUser.role === 'grn' ? 'grn_receive' : 'attendance');
  if (currentUser.role === 'supervisor') updateSupervisorLocation();
}

function doLogout() {
  currentUser = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('login-role').value = '';
  document.getElementById('login-name-group').style.display = 'none';
  document.getElementById('login-pw-group').style.display = 'none';
  document.getElementById('login-err').style.display = 'none';
}

// ===================== NAV =====================
const MANAGER_NAV = [

  {id:'production',icon:'🏭',label:'Production'},
  {id:'workers',icon:'👷',label:'Workers'},

  {id:'queries_view',icon:'📋',label:'Queries'},
  {id:'broadcast',icon:'📣',label:'Broadcast'},
  {id:'export',icon:'⬇️',label:'Export Data'},
  {id:'parts_pricing',icon:'💰',label:'Parts & Pricing'},
  {id:'settings',icon:'⚙️',label:'Settings'},

const SUPERVISOR_NAV = [
  {id:'attendance',icon:'✅',label:'Attendance'},

  {id:'inv_use',icon:'🔧',label:'Inventory'},

function buildSidebar() {
  const nav = currentUser.role === 'manager' ? MANAGER_NAV : currentUser.role === 'grn' ? GRN_NAV : SUPERVISOR_NAV;
  const label = currentUser.role === 'manager' ? 'Admin' : currentUser.role === 'grn' ? 'Dispatch Inspector' : `Supervisor · ${currentUser.company||currentUser.team}`;
  // Desktop sidebar
  let sHtml = `<div class="nav-section"><div class="nav-section-label">${label}</div>`;
  nav.forEach(n => {
    sHtml += `<div class="nav-item" id="nav-${n.id}" onclick="showPage('${n.id}')"><span class="nav-icon">${n.icon}</span>${n.label}<span class="nav-badge" id="badge-${n.id}" style="display:none;margin-left:auto;width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0"></span></div>`;
  });
  sHtml += '</div>';
  document.getElementById('sidebar').innerHTML = sHtml;
  // Mobile bottom nav
  let mHtml = '';
  nav.forEach(n => {
    mHtml += `<div class="mnav-item" id="mnav-${n.id}" onclick="showPage('${n.id}')"><span class="mni">${n.icon}</span>${n.label}</div>`;
  });
  document.getElementById('mobile-nav-items').innerHTML = mHtml;
  // Refresh activity badges
  refreshActivityBadges();
}

function showPage(id) {
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.mnav-item').forEach(el => el.classList.remove('active'));
  const navEl = document.getElementById('nav-'+id);
  const mnavEl = document.getElementById('mnav-'+id);
  if (navEl) navEl.classList.add('active');
  if (mnavEl) mnavEl.classList.add('active');
  markPageSeen(id);
  const renderers = {
    dashboard: renderDashboard, production: renderProduction, workers: renderWorkers,
    worker_profile: renderWorkerProfile, export: renderExport,
    inventory_view: renderInventoryView, queries_view: renderQueriesView, settings: renderSettings,
    attendance: renderAttendance, worklog: renderWorklog, inv_use: renderInvUse, queries_add: renderQueriesAdd,
    grn_receive: renderGRNReceive, grn_history: renderGRNHistory,
    parts_pricing: renderPartsPricing,
    broadcast: renderBroadcast,
    inbox: renderInbox,
  };
  if (renderers[id]) renderers[id]();
}

function setContent(html) { document.getElementById('content').innerHTML = html; }

function showToast(msg) {
  const t = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function today() { return new Date().toISOString().slice(0,10); }
function fmtDate(d) { if(!d) return ''; return new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short'}); }
function avatarColor(i) {
  return ['#4f8ef7','#22c87a','#f59e0b','#ef4444','#14b8a6','#a855f7','#ec4899','#f97316'][i%8];
}
function uid() { return Math.random().toString(36).slice(2,8).toUpperCase(); }

// ===================== ACTIVITY BADGES =====================
// Track unseen activities for admin side panel
let _lastSeenCounts = JSON.parse(localStorage.getItem('mpkp_seen')||'{}');

async function refreshActivityBadges() {
  const d = await getData();
  if (currentUser?.role === 'manager') {
    const openQ = d.queries.filter(q=>q.status==='Open').length;
    const seenQ = _lastSeenCounts['queries_view']||0;
    showBadge('queries_view', openQ > seenQ);
    const todayGRN = (d.grn_receipts||[]).filter(r=>r.date===today()).length;
    const seenGRN = _lastSeenCounts['inventory_view']||0;
    showBadge('inventory_view', todayGRN > seenGRN);
    const todayLogs = d.worklog.filter(l=>l.date===today()).length;
    const seenProd = _lastSeenCounts['production']||0;
    showBadge('production', todayLogs > seenProd);
  }
  if (currentUser?.role === 'supervisor') {
    // Inbox badge: unread messages
    const myCompany = currentUser.company||'';
    const unread = (d.broadcasts||[]).filter(b=>{
      if (b.draft) return false;
      const forMe = b.to==='__all__'?(!b.toCompany||b.toCompany===myCompany||myCompany===''):b.to===currentUser.name;
      return forMe && !(b.readBy||[]).includes(currentUser.name);
    }).length;
    showBadge('inbox', unread > 0);
  }
}

function showBadge(navId, show) {
  const el = document.getElementById('badge-'+navId);
  if (el) el.style.display = show ? 'inline-block' : 'none';
}

function markPageSeen(pageId) {
  // Called when admin opens a page to clear its badge
  if (currentUser?.role !== 'manager') return;
  getData().then(d => {
    if (pageId==='queries_view') _lastSeenCounts['queries_view'] = d.queries.filter(q=>q.status==='Open').length;
    if (pageId==='inventory_view') _lastSeenCounts['inventory_view'] = (d.grn_receipts||[]).filter(r=>r.date===today()).length;
    if (pageId==='production') _lastSeenCounts['production'] = d.worklog.filter(l=>l.date===today()).length;
    localStorage.setItem('mpkp_seen', JSON.stringify(_lastSeenCounts));
    showBadge(pageId, false);
  });
}

// ===================== SUPERVISOR LAST LOCATION =====================
// Stores last known location per supervisor
async function updateSupervisorLocation() {
  if (currentUser?.role !== 'supervisor') return;
  if (!navigator.geolocation) return;
  try {
    const pos = await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{timeout:6000}));
    const loc = `${pos.coords.latitude.toFixed(5)},${pos.coords.longitude.toFixed(5)}`;
    const d = await getData();
    const sup = d.supervisors.find(s=>s.name===currentUser.name);
    if (sup) {
      sup.lastLocation = loc;
      sup.lastLocationTime = new Date().toISOString();
      await saveData(d);
    }
  } catch(e) { /* location denied or unavailable */ }
}

        <div class="card-title"><span class="ct-icon">✅</span>Mark Today</div>

async function markAtt(workerId, status, inTime, outTime) {
  if (!status) return;
  showLoading('Saving…');
  const d = await getData();
  const existing = d.attendance.findIndex(a => a.date===today() && a.workerId===workerId && a.supervisor===currentUser.name);
  const worker = d.workers.find(w=>w.id===workerId);
  let location = '';
  if (navigator.geolocation) {
    try {
      const pos = await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{timeout:5000}));
      location = `${pos.coords.latitude.toFixed(5)},${pos.coords.longitude.toFixed(5)}`;
    } catch(e) { location = 'Location denied'; }
  }
  const rec = {date:today(),workerId,workerName:worker?.name||'',status,inTime:inTime||'',outTime:outTime||'',location,supervisor:currentUser.name,team:currentUser.team};
  if (existing >= 0) d.attendance[existing] = rec; else d.attendance.push(rec);
  await saveData(d);
  await updateSupervisorLocation();
  refreshActivityBadges();
  hideLoading();
  showToast(`${worker?.name} marked ${status}`);
}

async function updateAttTime(workerId, field, value) {
  const d = await getData();
  const existing = d.attendance.findIndex(a => a.date===today() && a.workerId===workerId && a.supervisor===currentUser.name);
  if (existing >= 0) {
    if (field === 'in') d.attendance[existing].inTime = value;
    else d.attendance[existing].outTime = value;
    await saveData(d);
  }
}

function renderAttTable(d) {
  const recs = d.attendance.filter(a=>a.supervisor===currentUser.name).slice(-15).reverse();
  if (!recs.length) return '<div class="empty-state"><div class="es-icon">📋</div>No records yet</div>';
  return `<table class="data-table"><thead><tr><th>Date</th><th>Worker</th><th>Status</th><th>In Time</th><th>Out Time</th><th>Location</th></tr></thead><tbody>
    ${recs.map(r=>`<tr><td>${fmtDate(r.date)}</td><td>${r.workerName}</td><td><span class="badge ${r.status==='Present'?'badge-green':r.status==='Absent'?'badge-red':'badge-amber'}">${r.status}</span></td><td style="color:var(--green)">${r.inTime||'—'}</td><td style="color:var(--amber)">${r.outTime||'—'}</td><td style="font-size:11px;color:var(--text3)">${r.location||'—'}</td></tr>`).join('')}
  </tbody></table>`;
}

async function saveWorklog() {
  const wv = document.getElementById('wl-worker').value;
  const task = document.getElementById('wl-task').value;
  const part = document.getElementById('wl-part').value;
  const units = document.getElementById('wl-units').value;
  const hours = Number(document.getElementById('wl-hours').value) || 0;
  const rating = Number(document.getElementById('wl-rating').value) || 0;
  const notes = document.getElementById('wl-notes').value;
  if (!wv || !task || !units) { alert('Please fill Worker, Task, and Units.'); return; }
  if (hours > 24) { alert('Hours worked cannot exceed 24 hours in a day!'); return; }
  // Check total hours logged for this worker today
  const [wId, wName] = wv.split(':');
  showLoading('Saving…');
  const d = await getData();
  const todayHours = d.worklog.filter(l=>l.workerId===wId&&l.date===today()).reduce((s,l)=>s+l.hours,0);
  if (todayHours + hours > 24) {
    hideLoading();
    alert(`Total hours for ${wName} today would exceed 24h (already logged: ${todayHours}h). A day has only 24 hours!`);
    return;
  }
  d.worklog.push({date:today(),workerId:wId,workerName:wName,task,part:part||'',units:Number(units),hours,rating,notes,supervisor:currentUser.name,team:currentUser.team});
  await saveData(d);
  hideLoading();
  await updateSupervisorLocation();
  refreshActivityBadges();
  showToast('Work log saved!'); renderWorklog();
}

function setStarRating(n) {
  document.getElementById('wl-rating').value = n;
  for(let i=1;i<=5;i++) {
    document.getElementById('star-'+i).style.opacity = i<=n ? '1' : '0.3';
  }
}

  let alertHtml = lowItems.map(i=>`<div class="alert-row"><span class="alert-icon">⚠️</span><span style="color:var(--text)"><strong>${i.item}</strong> — only <strong style="color:var(--red)">${i.stock} ${i.unit}</strong> left</span></div>`).join('');

  setContent(`
    <div class="page active">
      <div class="page-title">Use Inventory ${companyLabel}</div>
      <div class="page-sub">Record items used — stock auto-updates${myCompany ? ` · Showing items for <strong>${myCompany}</strong>` : ''}</div>
      ${alertHtml ? `<div style="margin-bottom:12px">${alertHtml}</div>` : ''}
      <div class="card">
        <div class="card-title"><span class="ct-icon">🔧</span>Log Usage</div>
        <div class="form-row">
          <div class="field"><label>ITEM</label>
            <select id="iu-item"><option value="">Select item</option>
              ${companyInventory.map(i=>`<option value="${i.id}">${i.item} (${i.stock} ${i.unit})</option>`).join('')}
            </select>
          </div>
          <div class="field"><label>QUANTITY USED</label><input type="number" id="iu-qty" placeholder="0" min="0"></div>
          <div class="field"><label>PART</label>
            <select id="iu-purpose"><option value="">Select part</option><option>Di-Cut</option><option>Masking Tape</option><option>Aluminium Foil Tape</option><option>Other</option></select>
          </div>
        </div>
        <button class="btn-save" onclick="saveInvUse()">Use Item → Auto-deduct</button>
      </div>
      <div class="card">
        <div class="card-title"><span class="ct-icon">📦</span>Stock Levels${myCompany ? ` — ${myCompany}` : ''}</div>
        <table class="data-table"><thead><tr><th>Item</th><th>Stock</th><th>Unit</th><th>Status</th></tr></thead><tbody>
          ${companyInventory.map(i=>{
            const low=i.stock<=i.minLevel, crit=i.stock<=i.minLevel*0.5;
            return `<tr><td style="color:var(--text);font-weight:500">${i.item}</td><td style="color:${crit?'var(--red)':low?'var(--amber)':'var(--green)'};font-weight:600">${i.stock}</td><td>${i.unit}</td><td><span class="badge ${crit?'badge-red':low?'badge-amber':'badge-green'}">${crit?'Critical':low?'Low':'OK'}</span></td></tr>`;
          }).join('')}
        </tbody></table>
      </div>
      <div class="card">
        <div class="card-title"><span class="ct-icon">🕐</span>My Recent Usage</div>
        ${recent.length ? `<table class="data-table"><thead><tr><th>Date</th><th>Item</th><th>Qty</th><th>Part</th></tr></thead><tbody>
          ${recent.map(u=>`<tr><td>${fmtDate(u.date)}</td><td>${u.itemName}</td><td style="color:var(--amber);font-weight:500">-${u.qty}</td><td>${u.purpose||'-'}</td></tr>`).join('')}
        </tbody></table>` : '<div class="empty-state"><div class="es-icon">📦</div>No usage yet</div>'}
      </div>
    </div>`);
}

async function saveInvUse() {
  const itemId = document.getElementById('iu-item').value;
  const qty = Number(document.getElementById('iu-qty').value);
  const purpose = document.getElementById('iu-purpose').value;
  if (!itemId || !qty) { alert('Please select item and quantity.'); return; }
  showLoading('Saving…');
  const d = await getData();
  const inv = d.inventory.find(i=>i.id===itemId);
  if (!inv) { hideLoading(); return; }
  if (qty > inv.stock) { hideLoading(); alert(`Not enough stock! Only ${inv.stock} ${inv.unit} available.`); return; }
  inv.stock -= qty;
  d.inventory_usage.push({date:today(),itemId,itemName:inv.item,qty,purpose,supervisor:currentUser.name,team:currentUser.team,company:currentUser.company||''});
  await saveData(d);
  hideLoading();
  await updateSupervisorLocation();
  refreshActivityBadges();
  showToast(`${qty} ${inv.unit} of ${inv.item} used!`); renderInvUse();
}

// ===================== PIE CHART =====================
function drawCompanyPie(d) {
  const canvas = document.getElementById('company-pie');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const COMPANIES = d.clients || ['Tata Motors','Motherson','Suntake'];
  const COLORS = ['#4f8ef7','#22c87a','#f59e0b','#ef4444','#14b8a6'];
  // Count units by supervisor company from worklog
  const byCompany = {};
  d.worklog.forEach(l => {
    const sup = d.supervisors.find(s=>s.name===l.supervisor);
    const comp = sup?.company || 'Other';
    byCompany[comp] = (byCompany[comp]||0) + l.units;
  });
  const allComps = [...COMPANIES, ...Object.keys(byCompany).filter(c=>!COMPANIES.includes(c))];
  const data = allComps.map(c=>({label:c, value:byCompany[c]||0})).filter(x=>x.value>0);
  if (!data.length) {
    ctx.fillStyle = '#555c70'; ctx.font = '13px DM Sans, sans-serif'; ctx.textAlign='center';
    ctx.fillText('No production data yet', 110, 110); return;
  }
  const total = data.reduce((s,x)=>s+x.value,0);
  const cx=110, cy=110, r=85;
  let startAngle = -Math.PI/2;
  data.forEach((item,i) => {
    const slice = (item.value/total)*2*Math.PI;
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,r,startAngle,startAngle+slice);
    ctx.closePath();
    ctx.fillStyle = COLORS[i%COLORS.length];
    ctx.fill();
    ctx.strokeStyle='#161b27'; ctx.lineWidth=2; ctx.stroke();
    // Percentage label
    if (slice > 0.3) {
      const mid = startAngle + slice/2;
      ctx.fillStyle='#fff'; ctx.font='bold 12px DM Sans,sans-serif'; ctx.textAlign='center';
      ctx.fillText(Math.round(item.value/total*100)+'%', cx+Math.cos(mid)*55, cy+Math.sin(mid)*55+4);
    }
    startAngle += slice;
  });
  // Centre hole
  ctx.beginPath(); ctx.arc(cx,cy,40,0,2*Math.PI); ctx.fillStyle='#161b27'; ctx.fill();
  ctx.fillStyle='#e8eaf0'; ctx.font='bold 13px DM Sans,sans-serif'; ctx.textAlign='center';
  ctx.fillText('Units', cx, cy-4); ctx.fillText(total.toLocaleString(), cx, cy+14);
  // Legend
  const legend = document.getElementById('pie-legend');
  if (legend) legend.innerHTML = data.map((x,i)=>`<div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2)"><div style="width:10px;height:10px;border-radius:2px;background:${COLORS[i%COLORS.length]};flex-shrink:0"></div>${x.label}: <strong style="color:var(--text)">${x.value}</strong></div>`).join('');
}

          ${d.supervisors.map(s=>`<option value="${s.team}" ${filterTeam===s.team?'selected':''}>Team ${s.team}</option>`).join('')}
        </select>
      </div>

            <td style="color:var(--text);font-weight:500">${i===0?'🥇 ':''}${name}</td>

async function saveGRN() {
  const supplier = document.getElementById('grn-supplier').value.trim();
  const invoice = document.getElementById('grn-invoice').value.trim();
  const date = document.getElementById('grn-date').value;
  const clientRaw = document.getElementById('grn-client').value;
  const itemVal = document.getElementById('grn-item').value;
  const qty = Number(document.getElementById('grn-qty').value);
  const unit = document.getElementById('grn-unit').value;
  const remarks = document.getElementById('grn-remarks').value.trim();
  if (!supplier) { alert('Please enter supplier name.'); return; }
  if (!clientRaw) { alert('Please select a client company.'); return; }
  if (!itemVal) { alert('Please select an item.'); return; }
  if (!qty || qty <= 0) { alert('Please enter a valid quantity.'); return; }
  const clientName = clientRaw === '__shared__' ? '' : clientRaw;
  showLoading('Saving GRN…');
  const d = await getData();
  let itemId, itemName;
  if (itemVal === '__new__') {
    const newName = document.getElementById('grn-newitem').value.trim();
    if (!newName) { hideLoading(); alert('Please enter the new item name.'); return; }
    itemId = 'I' + uid();
    itemName = newName;
    d.inventory.push({id:itemId, item:itemName, stock:qty, unit, minLevel:10, company:clientName});
  } else {
    const parts = itemVal.split(':');
    itemId = parts[0]; itemName = parts[1];
    const inv = d.inventory.find(i=>i.id===itemId);
    if (inv) { inv.stock += qty; inv.company = clientName; } // ensure client tag is current
  }
  if (!d.grn_receipts) d.grn_receipts = [];
  let dispatchLocation = '';
  if (navigator.geolocation) {
    try {
      const pos = await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{timeout:5000}));
      dispatchLocation = `${pos.coords.latitude.toFixed(5)},${pos.coords.longitude.toFixed(5)}`;
    } catch(e) { dispatchLocation = 'Location denied'; }
  }
  d.grn_receipts.push({id:'GRN'+uid(), date, supplier, invoice, itemId, itemName, qty, unit, remarks, client:clientName, officer:currentUser.name, location:dispatchLocation, grnConfirmed:true});
  await saveData(d);
  hideLoading();
  showToast(`✅ GRN Confirmed — ${qty} ${unit} of ${itemName} → ${clientName||'Shared'}!`); renderGRNReceive();
}

  if (!w) { setContent(`<div class="page active">${selHtml}<div class="empty-state">Worker not found</div></div>`); return; }

  // Compute stats
  const attRecs = d.attendance.filter(a=>a.workerId===workerId);
  const present = attRecs.filter(a=>a.status==='Present').length;
  const absent  = attRecs.filter(a=>a.status==='Absent').length;
  const halfDay = attRecs.filter(a=>a.status==='Half Day').length;
  const total   = attRecs.length;
  const attPct  = total ? Math.round((present + halfDay*0.5)/total*100) : 0;

  const logs = d.worklog.filter(l=>l.workerId===workerId);
  const totalUnits = logs.reduce((s,l)=>s+l.units,0);
  const totalHours = logs.reduce((s,l)=>s+l.hours,0);
  const workDays   = new Set(logs.map(l=>l.date)).size;
  const avgUnits   = workDays ? Math.round(totalUnits/workDays) : 0;

  // Task breakdown
  const byTask = {};
  logs.forEach(l=>{ byTask[l.task]=(byTask[l.task]||0)+l.units; });
  const taskRows = Object.entries(byTask).sort((a,b)=>b[1]-a[1])
    .map(([t,u])=>`<tr><td style="color:var(--text)">${t}</td><td style="color:var(--accent);font-weight:600">${u}</td></tr>`).join('');

  // Last 7 days trend
  const days7 = [];
  for(let i=6;i>=0;i--){const dt=new Date();dt.setDate(dt.getDate()-i);days7.push(dt.toISOString().slice(0,10));}
  const trend = days7.map(day=>{
    const dayLog = logs.filter(l=>l.date===day);
    const att = attRecs.find(a=>a.date===day);
    return {day:new Date(day).toLocaleDateString('en-IN',{weekday:'short'}), units:dayLog.reduce((s,l)=>s+l.units,0), status:att?.status||''};
  });
  const maxT = Math.max(...trend.map(x=>x.units),1);
  const trendBars = trend.map(x=>{
    const col = x.status==='Present'?'var(--green)':x.status==='Absent'?'var(--red)':x.status==='Half Day'?'var(--amber)':'var(--bg4)';
    return `<div class="bar-wrap">
      <div class="bar-val" style="font-size:10px">${x.units||''}</div>
      <div class="bar" style="height:${Math.round(x.units/maxT*90)||4}px;background:${col}"></div>
      <div class="bar-label">${x.day}</div>
    </div>`;
  }).join('');

  // Recent logs table
  const recentLogs = logs.slice(-10).reverse();

  const avatarIdx = d.workers.findIndex(x=>x.id===workerId);

  setContent(`<div class="page active">
    <div class="page-title">Worker Profile</div>
    <div class="page-sub">Individual performance overview</div>
    ${selHtml}

    <!-- Worker card -->
    <div class="card" style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
      <div style="width:56px;height:56px;border-radius:50%;background:${avatarColor(avatarIdx)};display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:#fff;flex-shrink:0">
        ${w.name.split(' ').map(x=>x[0]).join('').slice(0,2)}
      </div>
      <div style="flex:1">
        <div style="font-size:18px;font-weight:600;color:var(--text)">${w.name}</div>
        <div style="font-size:13px;color:var(--text2);margin-top:3px">Team ${w.team} &nbsp;·&nbsp; <span class="badge badge-blue">${w.skill}</span></div>
      </div>
      <div style="text-align:right">
        <div style="font-size:11px;color:var(--text3)">ATTENDANCE RATE</div>
        <div style="font-size:28px;font-weight:700;color:${attPct>=80?'var(--green)':attPct>=60?'var(--amber)':'var(--red)'}">${attPct}%</div>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat blue"><div class="stat-label">Total Units</div><div class="stat-val">${totalUnits}</div><div class="stat-sub">all time</div></div>
      <div class="stat green"><div class="stat-label">Avg Units/Day</div><div class="stat-val">${avgUnits}</div><div class="stat-sub">on logged days</div></div>
      <div class="stat"><div class="stat-label">Total Hours</div><div class="stat-val">${Math.round(totalHours)}</div><div class="stat-sub">logged</div></div>
      <div class="stat green"><div class="stat-label">Days Present</div><div class="stat-val">${present}</div><div class="stat-sub">${halfDay} half-day · ${absent} absent</div></div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <!-- 7-day trend -->
      <div class="card">
        <div class="card-title"><span class="ct-icon">📈</span>Last 7 Days</div>
        <div style="font-size:11px;color:var(--text3);margin-bottom:6px">🟢 Present &nbsp; 🟡 Half Day &nbsp; 🔴 Absent</div>
        <div class="bar-chart">${trendBars}</div>
      </div>
      <!-- Task breakdown -->
      <div class="card">
        <div class="card-title"><span class="ct-icon">🔧</span>Units by Task</div>
        ${taskRows ? `<table class="data-table"><thead><tr><th>Task</th><th>Units</th></tr></thead><tbody>${taskRows}</tbody></table>`
          : '<div class="empty-state"><div class="es-icon">📋</div>No task logs yet</div>'}
      </div>
    </div>

    <!-- Recent logs -->
    <div class="card">
      <div class="card-title"><span class="ct-icon">📝</span>Recent Work Logs</div>
      ${recentLogs.length ? `<table class="data-table"><thead><tr><th>Date</th><th>Task</th><th>Part</th><th>Units</th><th>Hours</th><th>Rating</th><th>Notes</th></tr></thead><tbody>
        ${recentLogs.map(l=>`<tr>
          <td>${fmtDate(l.date)}</td>
          <td><span class="badge badge-blue">${l.task}</span></td>
          <td style="color:var(--teal)">${l.part||'—'}</td>
          <td style="color:var(--green);font-weight:600">${l.units}</td>
          <td>${l.hours}h</td>
          <td>${l.rating?'⭐'.repeat(l.rating):'—'}</td>
          <td style="color:var(--text3);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${l.notes||'—'}</td>
        </tr>`).join('')}
      </tbody></table>`
      : '<div class="empty-state"><div class="es-icon">📝</div>No logs yet</div>'}
    </div>
  </div>`);
}

async function exportCSV(type) {
  showLoading('Building CSV…');
  const d = await getData();
  hideLoading();
  let rows = [], filename = '';

  if (type === 'attendance') {
    filename = 'mpkp_attendance.csv';
    rows = [['Date','Worker','Team','Status','Supervisor']];
    d.attendance.forEach(r=>rows.push([r.date,r.workerName,r.team,r.status,r.supervisor]));
  } else if (type === 'worklog') {
    filename = 'mpkp_worklog.csv';
    rows = [['Date','Worker','Team','Task','Units','Hours','Notes','Supervisor']];
    d.worklog.forEach(r=>rows.push([r.date,r.workerName,r.team,r.task,r.units,r.hours,r.notes||'',r.supervisor]));
  } else if (type === 'workers') {
    filename = 'mpkp_workers.csv';
    rows = [['Name','Team','Skill','Days Present','Days Absent','Total Units','Total Hours']];
    d.workers.forEach(w=>{
      const present = d.attendance.filter(a=>a.workerId===w.id&&a.status==='Present').length;
      const absent  = d.attendance.filter(a=>a.workerId===w.id&&a.status==='Absent').length;
      const units   = d.worklog.filter(l=>l.workerId===w.id).reduce((s,l)=>s+l.units,0);
      const hours   = d.worklog.filter(l=>l.workerId===w.id).reduce((s,l)=>s+l.hours,0);
      rows.push([w.name,w.team,w.skill,present,absent,units,Math.round(hours)]);
    });
  } else if (type === 'inventory') {
    filename = 'mpkp_inventory.csv';
    rows = [['Item','Stock','Unit','Min Level','Status']];
    d.inventory.forEach(i=>{
      const st = i.stock<=i.minLevel*0.5?'Critical':i.stock<=i.minLevel?'Low':'OK';
      rows.push([i.item,i.stock,i.unit,i.minLevel,st]);
    });
  } else if (type === 'inventory_usage') {
    filename = 'mpkp_inventory_usage.csv';
    rows = [['Date','Item','Qty Used','Supervisor','Team','Purpose']];
    d.inventory_usage.forEach(r=>rows.push([r.date,r.itemName,r.qty,r.supervisor,r.team,r.purpose||'']));
  } else if (type === 'grn_receipts') {
    filename = 'mpkp_dispatch_receipts.csv';
    rows = [['Date','Supplier','Invoice','Item','Qty','Unit','Officer','Remarks']];
    (d.grn_receipts||[]).forEach(r=>rows.push([r.date,r.supplier,r.invoice||'',r.itemName,r.qty,r.unit,r.officer,r.remarks||'']));
  } else if (type === 'queries') {
    filename = 'mpkp_queries.csv';
    rows = [['Date','Supervisor','Team','Type','Priority','Status','Description']];
    d.queries.forEach(r=>rows.push([r.date,r.supervisor,r.team,r.type,r.priority,r.status,r.desc]));
  }

  if (!rows.length) { showToast('No data to export'); return; }
  downloadCSV(rows, filename);
  showToast(`Downloaded ${filename}`);
}

function downloadCSV(rows, filename) {
  const csv = rows.map(r=>r.map(v=>{
    const s = String(v==null?'':v);
    return s.includes(',') || s.includes('"') || s.includes('\n') ? `"${s.replace(/"/g,'""')}"` : s;
  }).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

async function exportAll() {

  const selComp = window._ppCompany !== undefined ? window._ppCompany : '';
  const compLabel = selComp || 'Shared';
  const filteredParts = selComp === '__all__' ? d.parts : d.parts.filter(p=>(p.company||'')=== selComp);

  // Revenue stats per company
  const todayLogs = d.worklog.filter(l=>l.date===today());
  let todayProfit = 0;
  todayLogs.forEach(l=>{ const p=d.parts.find(x=>x.name===l.part); if(p&&p.price) todayProfit+=p.price*l.units; });

  const weekDays = [];
  for(let i=6;i>=0;i--){const dt=new Date();dt.setDate(dt.getDate()-i);weekDays.push(dt.toISOString().slice(0,10));}
  const weekProfit = weekDays.map(day=>{
    const logs = d.worklog.filter(l=>l.date===day);
    let profit = 0;
    logs.forEach(l=>{ const part=d.parts.find(p=>p.name===l.part); if(part&&part.price) profit+=part.price*l.units; });
    return {day:new Date(day).toLocaleDateString('en-IN',{weekday:'short'}),profit};
  });
  const maxP = Math.max(...weekProfit.map(x=>x.profit),1);
  const profitBars = weekProfit.map(x=>`<div class="bar-wrap"><div class="bar-val" style="font-size:10px">${x.profit?'₹'+x.profit:''}</div><div class="bar" style="height:${Math.round(x.profit/maxP*90)||4}px;background:var(--green)"></div><div class="bar-label">${x.day}</div></div>`).join('');

  const tabHtml = `<div class="tabs" style="margin-bottom:1rem">
    <div class="tab ${selComp===''?'active':''}" onclick="window._ppCompany='';renderPartsPricing()">Shared</div>
    ${COMPANIES.map(c=>`<div class="tab ${selComp===c?'active':''}" onclick="window._ppCompany='${c}';renderPartsPricing()">${c}</div>`).join('')}
    <div class="tab ${selComp==='__all__'?'active':''}" onclick="window._ppCompany='__all__';renderPartsPricing()">All</div>
  </div>`;

  setContent(`
    <div class="page active">
      <div class="page-title">Parts & Pricing</div>
      <div class="page-sub">Set prices per part, per client company — controls worklog revenue calculations</div>

      <div class="stats-grid" style="margin-bottom:1.5rem">
        <div class="stat green"><div class="stat-label">Today's Revenue</div><div class="stat-val">₹${todayProfit.toLocaleString('en-IN')}</div><div class="stat-sub">all companies</div></div>
        <div class="stat blue"><div class="stat-label">Parts Configured</div><div class="stat-val">${d.parts.filter(p=>p.price>0).length}</div><div class="stat-sub">of ${d.parts.length} have prices</div></div>
        <div class="stat"><div class="stat-label">Companies</div><div class="stat-val">${new Set(d.parts.map(p=>p.company||'Shared')).size}</div><div class="stat-sub">with parts</div></div>
      </div>

      ${tabHtml}

      <div class="card">
        <div class="card-title"><span class="ct-icon">💰</span>Parts — ${compLabel} (₹ per unit)</div>
        <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:14px">
          ${filteredParts.length ? filteredParts.map(p=>`
          <div style="display:flex;align-items:center;gap:12px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;flex-wrap:wrap">
            <span style="flex:1;min-width:120px;font-size:13px;color:var(--text);font-weight:500">${p.name}</span>
            ${p.company?`<span class="badge badge-blue" style="font-size:10px">${p.company}</span>`:'<span class="badge badge-gray" style="font-size:10px">Shared</span>'}
            <div style="display:flex;align-items:center;gap:6px">
              <span style="color:var(--text2);font-size:13px">₹</span>
              <input type="number" id="price-${p.id}" value="${p.price||0}" min="0" step="0.01" placeholder="0.00"
                style="width:90px;background:var(--bg);border:1px solid var(--border2);border-radius:7px;padding:7px 10px;color:var(--text);font-family:DM Sans,sans-serif;font-size:13px;outline:none">
              <span style="color:var(--text3);font-size:11px">/ unit</span>
            </div>
            <button onclick="savePartPrice('${p.id}')" style="background:rgba(34,200,122,0.1);border:1px solid rgba(34,200,122,0.3);border-radius:7px;padding:7px 14px;color:var(--green);font-size:12px;cursor:pointer;font-family:DM Sans,sans-serif">Save</button>
            <button onclick="deletePart('${p.id}')" class="btn-del">Remove</button>
          </div>`).join('') : `<div class="empty-state"><div class="es-icon">💰</div>No parts for ${compLabel} yet</div>`}
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px">
          <input type="text" id="new-part-name" placeholder="New part name" style="flex:1;min-width:130px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);padding:9px 11px;color:var(--text);font-family:DM Sans,sans-serif;font-size:13px;outline:none">
          <select id="new-part-company" style="background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);padding:9px 11px;color:var(--text);font-family:DM Sans,sans-serif;font-size:13px;outline:none">
            <option value="">Shared</option>${COMPANIES.map(c=>`<option value="${c}">${c}</option>`).join('')}
          </select>
          <input type="number" id="new-part-price" placeholder="₹ Price" min="0" step="0.01" style="width:100px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);padding:9px 11px;color:var(--text);font-family:DM Sans,sans-serif;font-size:13px;outline:none">
          <button class="btn-save" onclick="addNewPart()">➕ Add Part</button>
        </div>
      </div>

      <div class="card">
        <div class="card-title"><span class="ct-icon">📈</span>Weekly Revenue (₹) — All Companies</div>
        <div class="bar-chart">${profitBars}</div>
      </div>

      <div class="card">
        <div class="card-title"><span class="ct-icon">🏭</span>Today's Production by Part</div>
        ${(() => {
          const byPart = {};
          todayLogs.forEach(l=>{ if(l.part){byPart[l.part]=(byPart[l.part]||{units:0,revenue:0,company:''}); byPart[l.part].units+=l.units; const pt=d.parts.find(p=>p.name===l.part); byPart[l.part].revenue+=(pt?.price||0)*l.units; byPart[l.part].company=pt?.company||''; }});
          const rows = Object.entries(byPart).map(([name,v])=>`<tr><td style="color:var(--text);font-weight:500">${name}</td><td>${v.company?`<span class="badge badge-blue" style="font-size:10px">${v.company}</span>`:'<span class="badge badge-gray" style="font-size:10px">Shared</span>'}</td><td style="color:var(--accent);font-weight:600">${v.units}</td><td style="color:var(--green);font-weight:600">₹${v.revenue.toLocaleString('en-IN')}</td></tr>`).join('');
          return rows ? `<table class="data-table"><thead><tr><th>Part</th><th>Company</th><th>Units</th><th>Revenue</th></tr></thead><tbody>${rows}</tbody></table>` : '<div class="empty-state"><div class="es-icon">💰</div>No production logged today</div>';
        })()}
      </div>
    </div>`);
}

async function savePartPrice(partId) {
  const price = Number(document.getElementById('price-'+partId).value) || 0;
  showLoading('Saving…');
  const d = await getData();
  const part = d.parts.find(p=>p.id===partId);
  if (part) part.price = price;
  await saveData(d);
  hideLoading();
  showToast(`Price saved — ₹${price}/unit`);
  renderPartsPricing();
}

async function deletePart(partId) {
  if (!confirm('Remove this part?')) return;
  showLoading('Removing…');
  const d = await getData();
  d.parts = d.parts.filter(p=>p.id!==partId);
  await saveData(d);
  hideLoading();
  showToast('Part removed');
  renderPartsPricing();
}

async function addNewPart() {
  const name = document.getElementById('new-part-name').value.trim();
  const price = Number(document.getElementById('new-part-price').value) || 0;
  const company = document.getElementById('new-part-company').value || '';
  if (!name) { alert('Please enter a part name.'); return; }
  showLoading('Saving…');
  const d = await getData();
  if (!d.parts) d.parts = [];
  if (d.parts.find(p=>p.name.toLowerCase()===name.toLowerCase()&&(p.company||'')===(company||''))) { hideLoading(); alert('This part already exists for this company.'); return; }
  d.parts.push({id:'P'+uid(),name,price,company});
  await saveData(d);
  hideLoading();
  showToast(`${name} added!`);
  window._ppCompany = company;
  renderPartsPricing();
}

function filterBcRecipients(company) {
  // When a company is selected, update the "Send To" dropdown to show only that company's supervisors
  getData().then(d=>{
    const sel = document.getElementById('bc-to');
    if (!sel) return;
    if (!company) {
      sel.innerHTML = ['<option value="__all__">📢 All Supervisors</option>',
        ...d.supervisors.map(s=>`<option value="${s.name}">${s.name} (${s.company||'—'} · Team ${s.team})</option>`)].join('');
    } else {
      const filtered = d.supervisors.filter(s=>s.company===company);
      sel.innerHTML = [`<option value="__company__${company}">🏭 All ${company} Supervisors (${filtered.length})</option>`,
        ...filtered.map(s=>`<option value="${s.name}">${s.name} · Team ${s.team}</option>`)].join('');
    }
  });
}

async function sendBroadcast(asDraft=false) {
  const to = document.getElementById('bc-to').value;
  const type = document.getElementById('bc-type').value;
  const priority = document.getElementById('bc-priority').value;
  const subject = document.getElementById('bc-subject').value.trim();
  const body = document.getElementById('bc-body').value.trim();
  const companyFilter = document.getElementById('bc-company').value;
  if (!to) { alert('Please select a recipient.'); return; }
  if (!body) { alert('Please write a message.'); return; }
  showLoading(asDraft?'Saving draft…':'Sending…');
  const d = await getData();
  if (!d.broadcasts) d.broadcasts = [];
  const now = new Date();
  const entry = {
    id:'B'+uid(), date:today(),
    time:now.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}),
    to: to.startsWith('__company__') ? '__all__' : to,
    toCompany: to.startsWith('__company__') ? to.replace('__company__','') : (companyFilter||''),
    type, priority, subject, body,
    from:'Admin', draft:!!asDraft, readBy:[]
  };
  d.broadcasts.push(entry);
  await saveData(d);
  hideLoading();
  showToast(asDraft?'Draft saved!':'Message sent to supervisors!');
  refreshActivityBadges();
  renderBroadcast();
}

async function sendDraft(idx) {
  showLoading('Sending…');
  const d = await getData();
  d.broadcasts[idx].draft = false;
  d.broadcasts[idx].date = today();
  d.broadcasts[idx].time = new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
  await saveData(d);
  hideLoading();
  showToast('Message sent!');
  renderBroadcast();
}

async function deleteBroadcast(idx) {
  if (!confirm('Delete this message?')) return;
  showLoading('Deleting…');
  const d = await getData();
  d.broadcasts.splice(idx,1);
  await saveData(d);
  hideLoading();
  showToast('Deleted');
  renderBroadcast();
}

// ===================== SUPERVISOR INBOX =====================
async function renderInbox() {
  showLoading('Loading inbox…');
  const d = await getData();
  hideLoading();
  if (!d.broadcasts) d.broadcasts = [];
  // Messages for this supervisor (sent to all, to their company, or directly to them)
  const myCompany = currentUser.company||'';
  const myMsgs = d.broadcasts.filter(b => {
    if (b.draft) return false;
    if (b.to === '__all__') return !b.toCompany || b.toCompany === myCompany || myCompany==='';
    if (b.to === currentUser.name) return true;
    return false;
  }).slice().reverse();
  // Mark as read — using the SAME d object (single fetch, no race)
  const unread = myMsgs.filter(b=>!(b.readBy||[]).includes(currentUser.name)).length;
  let needSave = false;
  d.broadcasts.forEach(b=>{
    if (b.draft) return;
    const forMe = b.to==='__all__'
      ? (!b.toCompany || b.toCompany===myCompany || myCompany==='')
      : b.to===currentUser.name;
    if (forMe && !(b.readBy||[]).includes(currentUser.name)) {
      if (!b.readBy) b.readBy=[];
      b.readBy.push(currentUser.name);
      needSave=true;
    }
  });
  if (needSave) { await saveData(d); }
  const msgTypeColors = {Alert:'badge-red',Update:'badge-blue',Reminder:'badge-amber',Notice:'badge-gray'};
  setContent(`
    <div class="page active">
      <div class="page-title">📬 Inbox</div>
      <div class="page-sub">Messages from Admin${unread>0?` — <span style="color:var(--accent);font-weight:600">${unread} new</span>`:''}</div>
      ${myMsgs.length ? myMsgs.map(b=>{
        const isNew = !(b.readBy||[]).includes(currentUser.name);
        const priorityBar = b.priority==='Urgent'?'border-left:3px solid var(--red)':b.priority==='High'?'border-left:3px solid var(--amber)':'';
        return `<div class="card" style="${priorityBar};${isNew?'border-color:rgba(79,142,247,0.4)':''}">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
              <span class="badge ${msgTypeColors[b.type]||'badge-gray'}">${b.type}</span>
              ${b.priority!=='Normal'?`<span class="badge ${b.priority==='Urgent'?'badge-red':'badge-amber'}">${b.priority==='Urgent'?'🚨':'⚡'} ${b.priority}</span>`:''}
              ${isNew?'<span class="badge badge-blue">New</span>':''}
            </div>
            <span style="font-size:11px;color:var(--text3)">${fmtDate(b.date)} ${b.time||''}</span>
          </div>
          ${b.subject?`<div style="font-size:14px;font-weight:600;color:var(--text);margin-bottom:6px">${b.subject}</div>`:''}
          <div style="font-size:13px;color:var(--text2);line-height:1.6;white-space:pre-wrap">${b.body}</div>
          <div style="margin-top:10px;font-size:11px;color:var(--text3)">From Admin · ${b.to==='__all__'?`Sent to all${b.toCompany?' ('+b.toCompany+')':''}`:''}</div>
        </div>`;
      }).join('') : '<div class="empty-state" style="margin-top:2rem"><div class="es-icon">📬</div>No messages yet</div>'}
    </div>`);
}

            style="flex:1;min-width:160px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);padding:9px 11px;color:var(--text);font-family:DM Sans,sans-serif;font-size:13px;outline:none">
          <button class="btn-save" onclick="addClient()">➕ Add Client</button>
        </div>
      </div>

      <!-- ADD WORKER -->
      <div class="card">
        <div class="card-title"><span class="ct-icon">👷</span>Add New Worker</div>
        <div class="form-row">
          <div class="field"><label>FULL NAME</label><input type="text" id="nw-name" placeholder="e.g. Rahul Gupta"></div>
          <div class="field"><label>TEAM</label>
            <select id="nw-team"><option value="">Select team</option>${d.supervisors.map(s=>`<option value="${s.team}">Team ${s.team} (${s.name})</option>`).join('')}</select>
          </div>
          <div class="field"><label>SKILL</label>
            <select id="nw-skill"><option>Assembly</option><option>Packaging</option><option>Quality Check</option><option>Welding</option><option>Painting</option><option>Loading</option><option>Other</option></select>
          </div>
        </div>
        <button class="btn-save" onclick="addWorker()">➕ Add Worker</button>
        <div style="margin-top:12px">
          <table class="data-table"><thead><tr><th>Name</th><th>Team</th><th>Skill</th><th></th></tr></thead><tbody>
            ${d.workers.map(w=>`<tr><td style="color:var(--text)">${w.name}</td><td>Team ${w.team}</td><td>${w.skill}</td><td><button class="btn-del" onclick="deleteWorkerS('${w.id}')">Remove</button></td></tr>`).join('')}
          </tbody></table>
        </div>
      </div>

      <!-- ADD SUPERVISOR -->
      <div class="card">
        <div class="card-title"><span class="ct-icon">🧑‍💼</span>Add New Supervisor</div>
        <div class="form-row">
          <div class="field"><label>FULL NAME</label><input type="text" id="ns-name" placeholder="e.g. Vikram Mehta"></div>
          <div class="field"><label>CLIENT COMPANY</label>
            <select id="ns-company"><option value="">Select company</option>${clientOptions}<option value="Other">Other</option></select>
          </div>
          <div class="field"><label>TEAM</label>
            <select id="ns-team"><option value="">Select team</option>${teamOptions}</select>
          </div>
          <div class="field"><label>PASSWORD</label><input type="password" id="ns-pw" placeholder="Set login password"></div>
        </div>
        <button class="btn-save" onclick="addSupervisor()">➕ Add Supervisor</button>
        <div style="margin-top:12px">
          <table class="data-table"><thead><tr><th>Name</th><th>Company</th><th>Team</th><th></th></tr></thead><tbody>
            ${d.supervisors.map(s=>`<tr><td style="color:var(--text)">${s.name}</td><td>${s.company||'—'}</td><td>Team ${s.team}</td><td><button class="btn-del" onclick="deleteSupervisor('${s.id}')">Remove</button></td></tr>`).join('')}
          </tbody></table>
        </div>
      </div>

      <!-- ADD GRN OFFICER -->
      <div class="card">
        <div class="card-title"><span class="ct-icon">📥</span>Add Dispatch Inspector</div>
        <div class="form-row">
          <div class="field"><label>FULL NAME</label><input type="text" id="ng-name" placeholder="e.g. Neha Joshi"></div>
          <div class="field"><label>PASSWORD</label><input type="password" id="ng-pw" placeholder="Set login password"></div>
        </div>
        <button class="btn-save" onclick="addGRNOfficer()">➕ Add Dispatch Inspector</button>
        <div style="margin-top:12px">
          <table class="data-table"><thead><tr><th>Name</th><th></th></tr></thead><tbody>
            ${(d.grn_officers||[]).map(g=>`<tr><td style="color:var(--text)">${g.name}</td><td><button class="btn-del" onclick="deleteGRNOfficer('${g.id}')">Remove</button></td></tr>`).join('')}
          </tbody></table>
        </div>
      </div>

      <!-- ADD INVENTORY ITEM -->
      <div class="card">
        <div class="card-title"><span class="ct-icon">📦</span>Add Inventory Item</div>
        <div class="form-row">
          <div class="field"><label>ITEM NAME</label><input type="text" id="ni-name" placeholder="e.g. Copper Wire"></div>
          <div class="field"><label>CLIENT COMPANY</label>
            <select id="ni-company"><option value="">Shared (all)</option>${clientOptions}</select>
          </div>
          <div class="field"><label>INITIAL STOCK</label><input type="number" id="ni-stock" placeholder="e.g. 100" min="0"></div>
          <div class="field"><label>UNIT</label>
            <select id="ni-unit"><option value="pcs">pcs</option><option value="kg">kg</option><option value="ltr">ltr</option><option value="m">m</option><option value="box">box</option></select>
          </div>
          <div class="field"><label>MIN LEVEL (alert)</label><input type="number" id="ni-min" placeholder="e.g. 20" min="0"></div>
        </div>
        <button class="btn-save" onclick="addInventoryItem()">➕ Add Item</button>
      </div>

      <!-- PASSWORDS -->
      <div class="card">
        <div class="card-title"><span class="ct-icon">🔑</span>Change Passwords</div>
        ${pwRows}
        <div style="margin-top:1rem;padding:10px 12px;background:rgba(34,200,122,0.07);border:1px solid rgba(34,200,122,0.2);border-radius:var(--radius);font-size:12px;color:var(--green)">
          ✅ Passwords are stored securely in Firebase Firestore — synced across all devices.
        </div>
      </div>
    </div>`);
}

// ===================== CLIENT MANAGEMENT =====================
async function addClient() {
  const name = document.getElementById('new-client-name').value.trim();
  if (!name) { alert('Please enter a client name.'); return; }
  showLoading('Saving…');
  const d = await getData();
  if (!d.clients) d.clients = [];
  if (d.clients.find(c=>c.toLowerCase()===name.toLowerCase())) { hideLoading(); alert('This client already exists.'); return; }
  d.clients.push(name);
  await saveData(d);
  hideLoading();
  showToast(`${name} added as client!`); renderSettings();
}

async function renameClient(idx) {
  const newName = document.getElementById('client-edit-'+idx).value.trim();
  if (!newName) { alert('Please enter a name.'); return; }
  showLoading('Renaming…');
  const d = await getData();
  if (!d.clients) d.clients = [];
  const oldName = d.clients[idx];
  d.clients[idx] = newName;
  // Update all references across supervisors, inventory, parts
  d.supervisors.forEach(s=>{ if(s.company===oldName) s.company=newName; });
  d.inventory.forEach(i=>{ if(i.company===oldName) i.company=newName; });
  if(d.parts) d.parts.forEach(p=>{ if(p.company===oldName) p.company=newName; });
  if(d.grn_receipts) d.grn_receipts.forEach(r=>{ if(r.client===oldName) r.client=newName; });
  await saveData(d);
  hideLoading();
  showToast(`Renamed to ${newName} — all references updated!`); renderSettings();
}

async function removeClient(idx) {
  const d = await getData();
  if (!d.clients) d.clients = [];
  const name = d.clients[idx];
  const inUse = d.supervisors.some(s=>s.company===name) || d.inventory.some(i=>i.company===name);
  if (inUse && !confirm(`"${name}" is still assigned to supervisors or inventory items. Remove anyway? (Their company will be cleared)`)) return;
  showLoading('Removing…');
  d.clients.splice(idx, 1);
  d.supervisors.forEach(s=>{ if(s.company===name) s.company=''; });
  d.inventory.forEach(i=>{ if(i.company===name) i.company=''; });
  if(d.parts) d.parts.forEach(p=>{ if(p.company===name) p.company=''; });
  await saveData(d);
  hideLoading();
  showToast(`${name} removed`); renderSettings();
}

async function addWorker() {
  const name = document.getElementById('nw-name').value.trim();
  const team = document.getElementById('nw-team').value;
  const skill = document.getElementById('nw-skill').value;
  if (!name || !team) { alert('Please fill Name and Team.'); return; }
  showLoading('Saving…');
  const d = await getData();
  d.workers.push({id:'W'+uid(), name, team, skill});
  await saveData(d);
  hideLoading();
  showToast(`${name} added!`); renderSettings();
}

async function deleteWorkerS(id) {
  if (!confirm('Remove this worker?')) return;
  showLoading('Removing…');
  const d = await getData();
  d.workers = d.workers.filter(w=>w.id!==id);
  await saveData(d);
  hideLoading();
  showToast('Worker removed'); renderSettings();
}

async function addSupervisor() {
  const name = document.getElementById('ns-name').value.trim();
  const company = document.getElementById('ns-company').value;
  const team = document.getElementById('ns-team').value;
  const pw = document.getElementById('ns-pw').value.trim();
  if (!name || !team) { alert('Please fill Name and Team.'); return; }
  if (!pw || pw.length < 4) { alert('Password must be at least 4 characters.'); return; }
  showLoading('Saving…');
  const d = await getData();
  if (d.supervisors.find(s=>s.name===name)) { hideLoading(); alert('A supervisor with this name already exists.'); return; }
  d.supervisors.push({id:'S'+uid(), name, team, company:company||''});
  await saveData(d);
  const passwords = await getPasswords();
  passwords[`supervisor:${name}`] = pw;
  await savePasswords(passwords);
  hideLoading();
  showToast(`${name} added as Supervisor!`); renderSettings();
}

async function deleteSupervisor(id) {
  if (!confirm('Remove this supervisor? They will no longer be able to log in.')) return;
  showLoading('Removing…');
  const d = await getData();
  const sup = d.supervisors.find(s=>s.id===id);
  d.supervisors = d.supervisors.filter(s=>s.id!==id);
  await saveData(d);
  if (sup) {
    const passwords = await getPasswords();
    delete passwords[`supervisor:${sup.name}`];
    await savePasswords(passwords);
  }
  hideLoading();
  showToast('Supervisor removed'); renderSettings();
}

async function addGRNOfficer() {
  const name = document.getElementById('ng-name').value.trim();
  const pw = document.getElementById('ng-pw').value.trim();
  if (!name) { alert('Please enter a name.'); return; }
  if (!pw || pw.length < 4) { alert('Password must be at least 4 characters.'); return; }
  showLoading('Saving…');
  const d = await getData();
  if (!d.grn_officers) d.grn_officers = [];
  if (d.grn_officers.find(g=>g.name===name)) { hideLoading(); alert('A GRN officer with this name already exists.'); return; }
  d.grn_officers.push({id:'G'+uid(), name});
  await saveData(d);
  const passwords = await getPasswords();
  passwords[`grn:${name}`] = pw;
  await savePasswords(passwords);
  hideLoading();
  showToast(`${name} added as Dispatch Inspector!`); renderSettings();
}

async function deleteGRNOfficer(id) {
  if (!confirm('Remove this GRN officer? They will no longer be able to log in.')) return;
  showLoading('Removing…');
  const d = await getData();
  const officer = (d.grn_officers||[]).find(g=>g.id===id);
  d.grn_officers = (d.grn_officers||[]).filter(g=>g.id!==id);
  await saveData(d);
  if (officer) {
    const passwords = await getPasswords();
    delete passwords[`grn:${officer.name}`];
    await savePasswords(passwords);
  }
  hideLoading();
  showToast('GRN Officer removed'); renderSettings();
}

async function addInventoryItem() {
  const name = document.getElementById('ni-name').value.trim();
  const stock = Number(document.getElementById('ni-stock').value);
  const unit = document.getElementById('ni-unit').value;
  const minLevel = Number(document.getElementById('ni-min').value) || 10;
  const company = document.getElementById('ni-company')?.value || '';
  if (!name || !stock) { alert('Please fill Item Name and Stock.'); return; }
  showLoading('Saving…');
  const d = await getData();
  if (d.inventory.find(i=>i.item.toLowerCase()===name.toLowerCase()&&(i.company||'')===(company||''))) { hideLoading(); alert('This item already exists for this company.'); return; }
  d.inventory.push({id:'I'+uid(), item:name, stock, unit, minLevel, company});
  await saveData(d);
  hideLoading();
  showToast(`${name} added to inventory!`); renderSettings();
}

async function changePw(key, b64key) {
  const input = document.getElementById('pw-' + b64key);
  const newPw = input.value.trim();
  if (!newPw) { alert('Please enter a new password.'); return; }
  if (newPw.length < 4) { alert('Minimum 4 characters.'); return; }
  showLoading('Updating password…');
  const passwords = await getPasswords();
  passwords[key] = newPw;
  await savePasswords(passwords);
  hideLoading();
  input.value = '';
  showToast('Password updated!'); renderSettings();
}
</script>
