<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MPKP Ltd — Building Trust, Delivering Quality</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f1117; --bg2: #161b27; --bg3: #1e2535; --bg4: #252d40;
  --border: rgba(255,255,255,0.08); --border2: rgba(255,255,255,0.14);
  --text: #e8eaf0; --text2: #8b90a0; --text3: #555c70;
  --accent: #4f8ef7; --accent2: #3a7ae8; --green: #22c87a; --green2: #1aad68;
  --amber: #f59e0b; --red: #ef4444; --teal: #14b8a6; --radius: 10px; --radius-lg: 14px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; }

/* LOGIN */
#login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; }
.login-box { background: var(--bg2); border: 1px solid var(--border2); border-radius: 20px; padding: 2.5rem; width: 100%; max-width: 400px; }
.login-logo { font-size: 22px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
.login-logo span { color: var(--accent); }
.login-sub { color: var(--text2); font-size: 13px; margin-bottom: 2rem; }
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 12px; color: var(--text2); margin-bottom: 6px; font-weight: 500; }
.form-group select, .form-group input { width: 100%; background: var(--bg3); border: 1px solid var(--border2); border-radius: var(--radius); padding: 10px 12px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14px; outline: none; transition: border-color 0.2s; }
.form-group select:focus, .form-group input:focus { border-color: var(--accent); }
.form-group select option { background: var(--bg3); }
.btn-primary { width: 100%; background: var(--accent); color: #fff; border: none; border-radius: var(--radius); padding: 11px; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer; }
.btn-primary:hover { background: var(--accent2); }

/* LAYOUT */
#app { display: none; min-height: 100vh; }
.topbar { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 0 1.5rem; display: flex; align-items: center; height: 56px; gap: 16px; position: sticky; top: 0; z-index: 100; }
.topbar-logo { font-size: 16px; font-weight: 600; }
.topbar-logo span { color: var(--accent); }
.topbar-user { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.user-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: #fff; }
.user-name { font-size: 13px; color: var(--text2); }
.logout-btn { background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 5px 12px; color: var(--text2); font-size: 12px; cursor: pointer; }
.logout-btn:hover { color: var(--text); }

.main { display: flex; }
.sidebar { width: 220px; min-height: calc(100vh - 56px); background: var(--bg2); border-right: 1px solid var(--border); padding: 1rem 0; flex-shrink: 0; }
.nav-section { padding: 0 12px; margin-bottom: 1.5rem; }
.nav-section-label { font-size: 10px; color: var(--text3); font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; padding: 0 8px; margin-bottom: 6px; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: var(--radius); cursor: pointer; color: var(--text2); font-size: 13px; font-weight: 400; transition: all 0.15s; margin-bottom: 2px; }
.nav-item:hover { background: var(--bg3); color: var(--text); }
.nav-item.active { background: rgba(79,142,247,0.12); color: var(--accent); }
.nav-icon { font-size: 16px; width: 18px; text-align: center; }
.content { flex: 1; padding: 1.5rem; overflow: auto; }

/* MOBILE BOTTOM NAV */
.mobile-nav { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg2); border-top: 1px solid var(--border2); z-index: 200; padding: 6px 0 8px; }
.mobile-nav-items { display: flex; justify-content: space-around; align-items: center; overflow-x: auto; }
.mnav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 8px; cursor: pointer; color: var(--text3); font-size: 10px; font-weight: 500; border-radius: 8px; min-width: 48px; transition: color 0.15s; }
.mnav-item .mni { font-size: 20px; line-height: 1; }
.mnav-item.active { color: var(--accent); }
.mnav-item:active { background: var(--bg3); }

/* CARDS */
.page { display: none; }
.page.active { display: block; }
.page-title { font-size: 20px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
.page-sub { font-size: 13px; color: var(--text2); margin-bottom: 1.5rem; }
.card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1.25rem; margin-bottom: 1rem; }
.card-title { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 1rem; display: flex; align-items: center; gap: 8px; }
.card-title .ct-icon { font-size: 16px; }

/* STATS */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr)); gap: 12px; margin-bottom: 1.5rem; }
.stat { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1rem 1.25rem; }
.stat-label { font-size: 11px; color: var(--text2); font-weight: 500; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
.stat-val { font-size: 26px; font-weight: 600; color: var(--text); letter-spacing: -0.5px; line-height: 1; }
.stat-sub { font-size: 11px; color: var(--text3); margin-top: 4px; }
.stat.green .stat-val { color: var(--green); }
.stat.amber .stat-val { color: var(--amber); }
.stat.red .stat-val { color: var(--red); }
.stat.blue .stat-val { color: var(--accent); }

/* FORMS */
.form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px,1fr)); gap: 12px; margin-bottom: 14px; }
.field label { display: block; font-size: 11px; color: var(--text2); margin-bottom: 5px; font-weight: 500; }
.field input, .field select, .field textarea { width: 100%; background: var(--bg3); border: 1px solid var(--border2); border-radius: var(--radius); padding: 9px 11px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 13px; outline: none; transition: border-color 0.2s; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
.field select option { background: var(--bg3); }
.field textarea { resize: vertical; min-height: 70px; }
.btn-save { background: var(--green); color: #fff; border: none; border-radius: var(--radius); padding: 10px 20px; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; }
.btn-save:hover { background: var(--green2); }
.btn-secondary { background: var(--bg3); color: var(--text2); border: 1px solid var(--border2); border-radius: var(--radius); padding: 10px 16px; font-family: 'DM Sans', sans-serif; font-size: 13px; cursor: pointer; }

/* TABLE */
.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.data-table th { text-align: left; padding: 8px 12px; color: var(--text3); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid var(--border); }
.data-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); color: var(--text2); vertical-align: middle; }
.data-table tr:last-child td { border-bottom: none; }
.data-table tr:hover td { background: var(--bg3); color: var(--text); }
.badge { display: inline-block; font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 20px; }
.badge-green { background: rgba(34,200,122,0.12); color: var(--green); }
.badge-amber { background: rgba(245,158,11,0.12); color: var(--amber); }
.badge-red { background: rgba(239,68,68,0.12); color: var(--red); }
.badge-blue { background: rgba(79,142,247,0.12); color: var(--accent); }
.badge-gray { background: var(--bg3); color: var(--text2); }
.empty-state { text-align: center; padding: 2.5rem; color: var(--text3); font-size: 13px; }
.empty-state .es-icon { font-size: 32px; margin-bottom: 8px; opacity: 0.4; }

/* TOAST */
.toast { position: fixed; bottom: 80px; right: 16px; background: var(--bg3); border: 1px solid var(--border2); border-radius: var(--radius-lg); padding: 12px 18px; font-size: 13px; color: var(--text); z-index: 999; display: none; align-items: center; gap: 10px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
.toast.show { display: flex; }
.toast-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); flex-shrink: 0; }

/* INVENTORY ALERT */
.alert-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: rgba(239,68,68,0.07); border: 1px solid rgba(239,68,68,0.2); border-radius: var(--radius); margin-bottom: 8px; font-size: 13px; }
.alert-icon { color: var(--red); font-size: 16px; }

/* BAR CHART */
.bar-chart { display: flex; align-items: flex-end; gap: 8px; height: 120px; margin-top: 12px; }
.bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; height: 100%; justify-content: flex-end; }
.bar { width: 100%; border-radius: 4px 4px 0 0; background: var(--accent); transition: height 0.3s ease; min-height: 4px; }
.bar-label { font-size: 10px; color: var(--text3); white-space: nowrap; }
.bar-val { font-size: 11px; color: var(--text2); font-weight: 500; }

/* ATTENDANCE GRID */
.att-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px,1fr)); gap: 10px; }
.att-worker { background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; display: flex; align-items: center; gap: 10px; }
.att-avatar { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: #fff; flex-shrink: 0; }
.att-name { font-size: 12px; font-weight: 500; color: var(--text); }
.att-status { font-size: 11px; margin-top: 2px; }

/* PASSWORD ROWS */
.pw-row { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); flex-wrap:wrap; }
.pw-row:last-child { border-bottom:none; }
.pw-name { min-width:130px; font-size:13px; color:var(--text); font-weight:500; }
.pw-role { font-size:11px; color:var(--text3); }

/* DELETE BUTTON */
.btn-del { background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.25); border-radius:7px; padding:4px 10px; color:var(--red); font-size:11px; cursor:pointer; font-family:'DM Sans',sans-serif; white-space:nowrap; }
.btn-edit { background:rgba(79,142,247,0.1); border:1px solid rgba(79,142,247,0.3); border-radius:7px; padding:4px 10px; color:var(--accent); font-size:11px; cursor:pointer; font-family:'DM Sans',sans-serif; white-space:nowrap; }

/* TABS */
.tabs { display: flex; gap: 4px; background: var(--bg3); border-radius: var(--radius); padding: 4px; margin-bottom: 1.25rem; width: fit-content; flex-wrap: wrap; }
.tab { padding: 6px 14px; border-radius: 7px; font-size: 12px; font-weight: 500; cursor: pointer; color: var(--text2); transition: all 0.15s; }
.tab.active { background: var(--bg2); color: var(--text); border: 1px solid var(--border2); }

/* CHECKBOX MULTI-SELECT */
.worker-checkbox-list { display: flex; flex-direction: column; gap: 6px; max-height: 180px; overflow-y: auto; background: var(--bg3); border: 1px solid var(--border2); border-radius: var(--radius); padding: 8px; }
.worker-checkbox-item { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 6px; cursor: pointer; }
.worker-checkbox-item:hover { background: var(--bg4); }
.worker-checkbox-item input[type=checkbox] { accent-color: var(--accent); width: 15px; height: 15px; cursor: pointer; }
.worker-checkbox-item label { font-size: 13px; color: var(--text); cursor: pointer; }

/* EXPENSE CARD */
.expense-balance { background: linear-gradient(135deg, rgba(79,142,247,0.15), rgba(34,200,122,0.1)); border: 1px solid rgba(79,142,247,0.3); border-radius: var(--radius-lg); padding: 1.25rem; margin-bottom: 1rem; }


/* COLLAPSIBLE SECTIONS */
.collapsible-header { display:flex; align-items:center; justify-content:space-between; cursor:pointer; user-select:none; }
.collapsible-header:hover .collapse-toggle { color: var(--text); }
.collapse-toggle { font-size:11px; color:var(--text3); display:flex; align-items:center; gap:5px; padding:3px 8px; background:var(--bg3); border:1px solid var(--border); border-radius:6px; white-space:nowrap; transition:all 0.15s; }
.collapse-toggle:hover { border-color:var(--border2); }
.collapsible-body { overflow:hidden; transition:max-height 0.3s ease, opacity 0.2s ease; }
.collapsible-body.collapsed { max-height:0 !important; opacity:0; pointer-events:none; }
.collapsible-body.expanded { opacity:1; }

/* MOBILE */
@media (max-width: 640px) {
  .sidebar { display: none !important; }
  .mobile-nav { display: block; }
  .topbar { padding: 0 1rem; }
  .topbar .user-name { display: none; }
  .content { padding: 1rem; padding-bottom: 80px; }
  .stats-grid { grid-template-columns: 1fr 1fr; }
  .form-row { grid-template-columns: 1fr; }
  .data-table { font-size: 12px; }
  .data-table th, .data-table td { padding: 7px 8px; }
  .toast { bottom: 90px; right: 12px; left: 12px; }
  .pw-row { flex-direction: column; align-items: flex-start; }
  .pw-row input { width: 100%; }
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">MPKP<span> Ltd</span></div>
    <div class="login-sub" style="color:var(--accent);font-style:italic;font-size:14px">Building Trust, Delivering Quality</div>
    <div style="background:rgba(79,142,247,0.07);border:1px solid rgba(79,142,247,0.2);border-radius:8px;padding:8px 12px;font-size:11px;color:var(--text2);margin-bottom:16px">🏭 Adhesive material specialists — Di-cuts, Masking Tape, Aluminium Foil Tape</div>
    <div class="form-group">
      <label>USER ID</label>
      <input type="text" id="login-userid" placeholder="e.g. ADM001 / SUP001" autocomplete="username" onkeydown="if(event.key==='Enter')document.getElementById('login-pw').focus()" oninput="this.value=this.value.toUpperCase()">
      <div style="font-size:11px;color:var(--text3);margin-top:5px">Your User ID was given to you by the Admin.</div>
    </div>
    <div class="form-group">
      <label>PASSWORD</label>
      <input type="password" id="login-pw" placeholder="Enter your password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <div id="login-err" style="color:var(--red);font-size:12px;margin-bottom:8px;display:none">❌ Invalid User ID or Password. Try again.</div>
    <button class="btn-primary" onclick="doLogin()" style="margin-top:8px">Enter App</button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <div class="topbar-logo">MPKP<span> Ltd</span></div>
    <div class="topbar-user">
      <div class="user-avatar" id="tb-avatar">?</div>
      <div class="user-name" id="tb-name">User</div>
      <button class="logout-btn" onclick="doLogout()">Logout</button>
    </div>
  </div>
  <div class="main">
    <div class="sidebar" id="sidebar"></div>
    <div class="content" id="content"></div>
  </div>
  <nav class="mobile-nav" id="mobile-nav">
    <div class="mobile-nav-items" id="mobile-nav-items"></div>
  </nav>
</div>

<div class="toast" id="toast"><div class="toast-dot"></div><span id="toast-msg">Saved!</span></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAwHyR9riUSav5TYuzmFnKw84ZUB5l0cCs",
  authDomain: "worktrack-630af.firebaseapp.com",
  projectId: "worktrack-630af",
  storageBucket: "worktrack-630af.firebasestorage.app",
  messagingSenderId: "262863331596",
  appId: "1:262863331596:web:a68ec14823475ef6a5a929"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const APP_DOC = db.collection('appdata').doc('main');
const PW_DOC  = db.collection('appdata').doc('passwords');

const DEFAULT_DATA = {
  workers: [
    {id:'W1',name:'Amit Sharma',team:'A',skill:'Assembly',salary:0},
    {id:'W2',name:'Priya Patel',team:'A',skill:'Quality Check',salary:0},
    {id:'W3',name:'Ravi Kumar',team:'B',skill:'Packaging',salary:0},
    {id:'W4',name:'Sunita Verma',team:'B',skill:'Assembly',salary:0},
    {id:'W5',name:'Deepak Singh',team:'C',skill:'Welding',salary:0},
    {id:'W6',name:'Kavita Nair',team:'C',skill:'Painting',salary:0},
  ],
  supervisors: [
    {id:'S1',name:'James Torres',team:'A',salary:0},
    {id:'S2',name:'Sara Patel',team:'B',salary:0},
    {id:'S3',name:'Rob Lee',team:'C',salary:0},
  ],
  skills: ['Assembly','Packaging','Quality Check','Welding','Painting','Loading','Masking'],
  inventory: [
    {id:'I1',item:'Steel Rods',stock:200,unit:'kg',minLevel:50},
    {id:'I2',item:'Paint (Blue)',stock:80,unit:'ltr',minLevel:20},
    {id:'I3',item:'Bolts M10',stock:500,unit:'pcs',minLevel:100},
    {id:'I4',item:'Welding Wire',stock:30,unit:'kg',minLevel:25},
    {id:'I5',item:'Safety Gloves',stock:40,unit:'pcs',minLevel:15},
  ],
  grn_officers: [{id:'G1',name:'Neha Joshi',salary:0}],
  client_supervisors: [{id:'CS1',name:'Client Admin',company:'Tata Motors'}],
  clients: ['Tata Motors','Motherson','Suntake'],
  parts: [
    {id:'P1',name:'Di-Cut',price:0},
    {id:'P2',name:'Masking Tape',price:0},
    {id:'P3',name:'Aluminium Foil Tape',price:0},
  ],
  petty_cash_allocations: [],
  attendance: [], worklog: [], inventory_usage: [], grn_receipts: [],
  queries: [], broadcasts: [], expenses: [], action_logs: [], prod_confirmations: [],
};

// Passwords stored as {userId: {password, role, name}}
// User IDs are private — only visible to Admin in Settings
// SECURITY: These are only used on first-time setup. After that, Firestore is the source of truth.
// IMPORTANT: Change all default passwords immediately after first login.
const DEFAULT_PASSWORDS = {
  'ADM001': {password:'manager123', role:'manager',           name:'Karen Mills'},
  'SUP001': {password:'teamA123',   role:'supervisor',        name:'James Torres'},
  'SUP002': {password:'teamB123',   role:'supervisor',        name:'Sara Patel'},
  'SUP003': {password:'teamC123',   role:'supervisor',        name:'Rob Lee'},
  'GRN001': {password:'grn123',     role:'grn',               name:'Neha Joshi'},
  'CLI001': {password:'client123',  role:'client_supervisor', name:'Client Admin'},
};

let _dataCache = null;
let _pwCache   = null;

async function loadData() {
  const snap = await APP_DOC.get();
  if (snap.exists) { _dataCache = snap.data(); }
  else { await APP_DOC.set(DEFAULT_DATA); _dataCache = JSON.parse(JSON.stringify(DEFAULT_DATA)); }
  if (!_dataCache.skills) _dataCache.skills = ['Assembly','Packaging','Quality Check','Welding','Painting','Loading','Masking'];
  if (!_dataCache.petty_cash_allocations) _dataCache.petty_cash_allocations = [];
  if (!_dataCache.expenses) _dataCache.expenses = [];
  if (!_dataCache.clients) _dataCache.clients = ['Tata Motors','Motherson','Suntake'];
  if (!_dataCache.action_logs) _dataCache.action_logs = [];
  if (!_dataCache.client_supervisors) _dataCache.client_supervisors = [];
  if (!_dataCache.prod_confirmations) _dataCache.prod_confirmations = [];
  if (!_dataCache.admin_profile) _dataCache.admin_profile = {name:'Karen Mills',company:'MPKP Ltd',phone:'',email:''};
  _dataCache.workers.forEach(w=>{ if(w.salary===undefined) w.salary=0; });
  _dataCache.supervisors.forEach(s=>{ if(s.salary===undefined) s.salary=0; });
  (_dataCache.grn_officers||[]).forEach(g=>{ if(g.salary===undefined) g.salary=0; });
  return _dataCache;
}
async function saveData(d) { _dataCache = d; await APP_DOC.set(d); }
async function getData() { return await loadData(); }
async function loadPasswords() {
  try {
    const snap = await PW_DOC.get();
    if (snap.exists) {
      const data = snap.data();

      // ── CASE 1: Already new format (keys like ADM001, SUP001) ──
      const isNewFormat = Object.keys(data).length > 0 && Object.values(data).every(v => typeof v === 'object' && v !== null && 'password' in v);
      if (isNewFormat) {
        _pwCache = data;
        return _pwCache;
      }

      // ── CASE 2: Old format keys like "manager:Karen Mills" → migrate ──
      const isOldFormat = Object.keys(data).some(k => k.includes(':'));
      if (isOldFormat) {
        const migrated = {};
        let supN=1, grnN=1, cliN=1;
        Object.entries(data).forEach(([key, pw]) => {
          const pwStr = typeof pw === 'object' ? (pw.password || '') : pw;
          if (key.startsWith('manager:')) {
            migrated['ADM001'] = { password: pwStr, role: 'manager', name: key.replace('manager:','') };
          } else if (key.startsWith('supervisor:')) {
            const uid = 'SUP' + String(supN).padStart(3,'0'); supN++;
            migrated[uid] = { password: pwStr, role: 'supervisor', name: key.replace('supervisor:','') };
          } else if (key.startsWith('grn:')) {
            const uid = 'GRN' + String(grnN).padStart(3,'0'); grnN++;
            migrated[uid] = { password: pwStr, role: 'grn', name: key.replace('grn:','') };
          } else if (key.startsWith('client_supervisor:')) {
            const uid = 'CLI' + String(cliN).padStart(3,'0'); cliN++;
            migrated[uid] = { password: pwStr, role: 'client_supervisor', name: key.replace('client_supervisor:','') };
          }
        });
        await PW_DOC.set(migrated);
        _pwCache = migrated;
        return _pwCache;
      }

      // ── CASE 3: Unknown / empty — fall back to defaults ──
      await PW_DOC.set(DEFAULT_PASSWORDS);
      _pwCache = JSON.parse(JSON.stringify(DEFAULT_PASSWORDS));
    } else {
      // ── CASE 4: Document does not exist — create defaults ──
      await PW_DOC.set(DEFAULT_PASSWORDS);
      _pwCache = JSON.parse(JSON.stringify(DEFAULT_PASSWORDS));
    }
  } catch(e) {
    // ── CASE 5: Firebase error — use defaults so login never breaks ──
    console.warn('MPKP: Firebase password load failed, using defaults.', e);
    _pwCache = JSON.parse(JSON.stringify(DEFAULT_PASSWORDS));
  }
  return _pwCache;
}
async function savePasswords(p) { _pwCache = p; try { await PW_DOC.set(p); } catch(e) { console.warn('Save passwords failed', e); } }
async function getPasswords() { if (_pwCache) return _pwCache; return await loadPasswords(); }
async function checkPassword(role, name, pw) {
  // Legacy helper kept for any internal use — not used by login screen anymore
  const passwords = await getPasswords();
  const entry = Object.values(passwords).find(e => e.role===role && e.name===name);
  return entry ? entry.password === pw : false;
}

// ===================== LOGIN =====================
// Login uses User ID + Password only. Role and name are never exposed on the login screen.
async function doLogin() {
  const userId = (document.getElementById('login-userid').value || '').trim().toUpperCase();
  const pw = document.getElementById('login-pw').value;
  const errEl = document.getElementById('login-err');
  if (!userId) { alert('Please enter your User ID.'); return; }
  if (!pw) { alert('Please enter your password.'); return; }
  showLoading('Verifying…');
  const passwords = await getPasswords();
  hideLoading();
  const entry = passwords[userId];
  if (!entry || entry.password !== pw) {
    await new Promise(r => setTimeout(r, 800)); // anti-brute-force delay
    errEl.style.display='block';
    document.getElementById('login-pw').value='';
    hideLoading();
    return;
  }
  errEl.style.display='none';
  const { role, name } = entry;
  currentUser = { role, name, team: null };
  // Load extra fields (team/company) from app data
  const d2 = await getData();
  if (role === 'supervisor') {
    const supRec = d2.supervisors.find(s=>s.name===name);
    currentUser.team = supRec?.team || null;
    currentUser.company = supRec?.company || '';
  } else if (role === 'grn') {
    currentUser.company = '';
  } else if (role === 'client_supervisor') {
    const csRec = (d2.client_supervisors||[]).find(cs=>cs.name===name);
    currentUser.company = csRec?.company || '';
  } else if (role === 'manager') {
    currentUser.company = '';
  }
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('tb-name').textContent = currentUser.name;
  document.getElementById('tb-avatar').textContent = currentUser.name.split(' ').map(w=>w[0]).join('').slice(0,2);
  buildSidebar();
  showPage(role==='manager' ? 'dashboard' : role==='grn' ? 'grn_receive' : role==='client_supervisor' ? 'prod_confirm' : 'attendance');
  if (role==='supervisor') updateSupervisorLocation();
  if(role==='supervisor'||role==='grn') logAction('Login', `Logged in as ${role}`);
}

function doLogout() {
  currentUser = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('login-userid').value = '';
  document.getElementById('login-pw').value = '';
  document.getElementById('login-err').style.display = 'none';
}

let _lastSeenCounts = JSON.parse(localStorage.getItem('mpkp_seen')||'{}');
async function refreshActivityBadges() {
  const d = await getData();
  if (currentUser?.role==='manager') {
    const openQ = d.queries.filter(q=>q.status==='Open').length;
    showBadge('queries_view', openQ > (_lastSeenCounts['queries_view']||0));
    const todayGRN = (d.grn_receipts||[]).filter(r=>r.date===today()).length;
    showBadge('inventory_view', todayGRN > (_lastSeenCounts['inventory_view']||0));
    showBadge('production', d.worklog.filter(l=>l.date===today()).length > (_lastSeenCounts['production']||0));
    const newLogs = (d.action_logs||[]).filter(l=>l.date===today()).length;
    showBadge('location_log', newLogs > (_lastSeenCounts['location_log']||0));
    // Badge for new production confirmations
    const unconfirmedCount = (d.prod_confirmations||[]).filter(c=>!c.seenByAdmin).length;
    showBadge('production', unconfirmedCount > 0 || d.worklog.filter(l=>l.date===today()).length > (_lastSeenCounts['production']||0));
  }
  if (currentUser?.role==='client_supervisor') {
    // Badge on prod_confirm for unconfirmed work logs
    const myCompany = currentUser.company||'';
    const confirmedIds = new Set((d.prod_confirmations||[]).filter(c=>c.confirmedBy===currentUser.name).map(c=>c.worklogId));
    const pendingCount = d.worklog.filter(l=>{
      const sup = d.supervisors.find(s=>s.name===l.supervisor);
      return (!myCompany || (sup&&sup.company===myCompany)) && !confirmedIds.has(l.id||`${l.date}-${l.workerName}-${l.task}`);
    }).length;
    showBadge('prod_confirm', pendingCount > 0);
  }
  if (currentUser?.role==='supervisor') {
    const myCompany = currentUser.company||'';
    const unread = (d.broadcasts||[]).filter(b=>{
      if(b.draft) return false;
      const forMe = b.to==='__all__' ? (!b.toCompany||b.toCompany===myCompany||myCompany==='') : b.to===currentUser.name;
      return forMe && !(b.readBy||[]).includes(currentUser.name);
    }).length;
    showBadge('inbox', unread>0);
  }
}
function showBadge(navId, show) { const el=document.getElementById('badge-'+navId); if(el) el.style.display=show?'inline-block':'none'; }
function markPageSeen(pageId) {
  if (currentUser?.role!=='manager') return;
  getData().then(async d=>{
    if(pageId==='queries_view') _lastSeenCounts['queries_view']=d.queries.filter(q=>q.status==='Open').length;
    if(pageId==='inventory_view') _lastSeenCounts['inventory_view']=(d.grn_receipts||[]).filter(r=>r.date===today()).length;
    if(pageId==='production') {
      _lastSeenCounts['production']=d.worklog.filter(l=>l.date===today()).length;
      // Mark all prod confirmations as seen
      let changed = false;
      (d.prod_confirmations||[]).forEach(c=>{ if(!c.seenByAdmin){c.seenByAdmin=true;changed=true;} });
      if(changed) await saveData(d);
    }
    if(pageId==='location_log') _lastSeenCounts['location_log']=(d.action_logs||[]).filter(l=>l.date===today()).length;
    localStorage.setItem('mpkp_seen', JSON.stringify(_lastSeenCounts));
    showBadge(pageId, false);
  });
}

// ===================== ACTION LOGGER =====================
async function logAction(action, details='') {
  if (!currentUser || currentUser.role==='manager') return;
  let loc = 'Unavailable', lat=null, lng=null;
  if (navigator.geolocation) {
    try {
      const pos = await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{timeout:5000,maximumAge:30000}));
      lat = pos.coords.latitude; lng = pos.coords.longitude;
      loc = `${lat.toFixed(6)},${lng.toFixed(6)}`;
    } catch(e) { loc = 'Location denied'; }
  }
  const entry = {
    id: 'LOG'+uid(),
    ts: new Date().toISOString(),
    date: today(),
    time: new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',second:'2-digit'}),
    supervisor: currentUser.name,
    role: currentUser.role,
    team: currentUser.team || '—',
    company: currentUser.company || '—',
    action,
    details,
    location: loc,
    lat, lng,
    mapUrl: (lat&&lng) ? `https://maps.google.com/?q=${lat},${lng}` : null,
  };
  try {
    const d = await getData();
    if (!d.action_logs) d.action_logs = [];
    d.action_logs.push(entry);
    if (d.action_logs.length > 500) d.action_logs = d.action_logs.slice(-500);
    // also update supervisor lastLocation
    if (lat) {
      const sup = d.supervisors.find(s=>s.name===currentUser.name);
      if (sup) { sup.lastLocation=loc; sup.lastLocationTime=new Date().toISOString(); }
    }
    await saveData(d);
  } catch(e) { console.warn('logAction failed', e); }
}

async function updateSupervisorLocation() {
  if (currentUser?.role!=='supervisor') return;
  if (!navigator.geolocation) return;
  try {
    const pos = await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{timeout:6000}));
    const loc = `${pos.coords.latitude.toFixed(5)},${pos.coords.longitude.toFixed(5)}`;
    const d = await getData();
    const sup = d.supervisors.find(s=>s.name===currentUser.name);
    if (sup) { sup.lastLocation=loc; sup.lastLocationTime=new Date().toISOString(); await saveData(d); }
  } catch(e) {}
}

async function saveAllAttendance() {
  showLoading('Saving all attendance…');
  const d = await getData();
  const myWorkers = d.workers.filter(w=>w.team===currentUser.team);
  let savedCount = 0;
  let location = '';
  if (navigator.geolocation) {
    try {
      const pos = await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{timeout:5000}));
      location = `${pos.coords.latitude.toFixed(5)},${pos.coords.longitude.toFixed(5)}`;
    } catch(e) { location='Location denied'; }
  }
  myWorkers.forEach(w=>{
    const statusEl = document.getElementById('att-status-'+w.id);
    const inEl = document.getElementById('in-'+w.id);
    const outEl = document.getElementById('out-'+w.id);
    const status = statusEl?.value || '';
    if (!status) return;
    const rec = {date:today(),workerId:w.id,workerName:w.name,status,inTime:inEl?.value||'',outTime:outEl?.value||'',location,supervisor:currentUser.name,team:currentUser.team};
    const existing = d.attendance.findIndex(a=>a.date===today()&&a.workerId===w.id&&a.supervisor===currentUser.name);
    if (existing>=0) d.attendance[existing]=rec; else d.attendance.push(rec);
    savedCount++;
  });
  if (savedCount===0) { hideLoading(); alert('Please select a status for at least one worker.'); return; }
  await saveData(d);
  await logAction('Attendance Saved', `Marked ${savedCount} workers for Team ${currentUser.team}`);

  hideLoading();
  showToast(`✅ Saved attendance for ${savedCount} workers!`);
  renderAttendance();

function editWorklogEntry(idx) {
  getData().then(d=>{
    const l = d.worklog[idx];

    document.getElementById('wl-edit-idx').value = idx;
    document.getElementById('wl-form-title').textContent = '✏️ Edit Entry';
    document.getElementById('wl-save-btn').textContent = '💾 Update Entry';
    document.getElementById('wl-cancel-btn').style.display = 'inline-block';
    d.workers.forEach(w=>{
      const chk = document.getElementById('wl-chk-'+w.id);
      if (chk) chk.checked = (w.name===l.workerName);
    });
    const taskSel = document.getElementById('wl-task');
    if (taskSel) taskSel.value = l.task;
    const partSel = document.getElementById('wl-part');
    if (partSel) partSel.value = l.part||'';

function cancelEditWorklog() {

async function saveWorklog() {
  const editIdx = document.getElementById('wl-edit-idx').value;
  const task = document.getElementById('wl-task').value;
  const part = document.getElementById('wl-part').value;
  const units = Number(document.getElementById('wl-units').value);
  const hours = Number(document.getElementById('wl-hours').value)||0;
  const rating = Number(document.getElementById('wl-rating').value)||0;
  const notes = document.getElementById('wl-notes').value;

  if (!task || !units) { alert('Please fill Task and Units.'); return; }
  if (hours > 12) { alert('Hours worked cannot exceed 12 hours per worker per entry!'); return; }

  const selectedWorkers = [];
  document.querySelectorAll('[id^="wl-chk-"]:checked').forEach(chk=>{
    const [wId,wName] = chk.value.split(':');
    selectedWorkers.push({id:wId, name:wName});
  });
  if (selectedWorkers.length===0) { alert('Please select at least one worker.'); return; }

  showLoading('Saving…');
  const d = await getData();

  for (const w of selectedWorkers) {
    const todayHours = d.worklog.filter(l=>l.workerId===w.id&&l.date===today()).reduce((s,l)=>s+l.hours,0);
    let oldHours = 0;
    if (editIdx!=='') {
      const oldLog = d.worklog[Number(editIdx)];
      if (oldLog && oldLog.workerId===w.id) oldHours = oldLog.hours;
    }
    if (todayHours - oldHours + hours > 12) {
      hideLoading();
      alert(`Total hours for ${w.name} today would exceed 12h (already logged: ${todayHours-oldHours}h). Max is 12 hours per day!`);
      return;
    }
  }

  if (editIdx !== '') {
    const idx = Number(editIdx);
    const w = selectedWorkers[0];
    d.worklog[idx] = {...d.worklog[idx], workerId:w.id, workerName:w.name, task, part:part||'', units, hours, rating, notes};
    showToast('Work log updated!');
  } else {
    for (const w of selectedWorkers) {
      d.worklog.push({date:today(),workerId:w.id,workerName:w.name,task,part:part||'',units,hours,rating,notes,supervisor:currentUser.name,team:currentUser.team});
    }
    showToast(`Work log saved for ${selectedWorkers.length} worker(s)!`);
  }

  await saveData(d);
  await logAction('Work Log Saved', `${selectedWorkers.length} worker(s) — ${task} / ${part||'no part'} / ${units} units`);
  hideLoading();
  refreshActivityBadges();
  renderWorklog();
}

  for(let i=1;i<=5;i++) { const el=document.getElementById('star-'+i); if(el) el.style.opacity=i<=n?'1':'0.3'; }
}

function drawCompanyPie(d) {
  const canvas = document.getElementById('company-pie'); if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const COMPANIES = d.clients||['Tata Motors','Motherson','Suntake'];
  const COLORS = ['#4f8ef7','#22c87a','#f59e0b','#ef4444','#14b8a6'];
  const byCompany = {};
  d.worklog.forEach(l=>{ const sup=d.supervisors.find(s=>s.name===l.supervisor); const comp=sup?.company||'Other'; byCompany[comp]=(byCompany[comp]||0)+l.units; });
  const allComps = [...COMPANIES,...Object.keys(byCompany).filter(c=>!COMPANIES.includes(c))];
  const data = allComps.map(c=>({label:c,value:byCompany[c]||0})).filter(x=>x.value>0);
  if (!data.length) { ctx.fillStyle='#555c70';ctx.font='13px DM Sans,sans-serif';ctx.textAlign='center';ctx.fillText('No data yet',110,110);return; }
  const total=data.reduce((s,x)=>s+x.value,0); const cx=110,cy=110,r=85; let startAngle=-Math.PI/2;
  data.forEach((item,i)=>{
    const slice=(item.value/total)*2*Math.PI;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,startAngle,startAngle+slice); ctx.closePath();
    ctx.fillStyle=COLORS[i%COLORS.length]; ctx.fill();
    ctx.strokeStyle='#161b27'; ctx.lineWidth=2; ctx.stroke();
    if(slice>0.3){ const mid=startAngle+slice/2; ctx.fillStyle='#fff'; ctx.font='bold 12px DM Sans,sans-serif'; ctx.textAlign='center'; ctx.fillText(Math.round(item.value/total*100)+'%',cx+Math.cos(mid)*55,cy+Math.sin(mid)*55+4); }
    startAngle+=slice;
  });
  ctx.beginPath(); ctx.arc(cx,cy,40,0,2*Math.PI); ctx.fillStyle='#161b27'; ctx.fill();
  ctx.fillStyle='#e8eaf0'; ctx.font='bold 13px DM Sans,sans-serif'; ctx.textAlign='center';
  ctx.fillText('Units',cx,cy-4); ctx.fillText(total.toLocaleString(),cx,cy+14);
  const legend=document.getElementById('pie-legend');
  if(legend) legend.innerHTML=data.map((x,i)=>`<div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2)"><div style="width:10px;height:10px;border-radius:2px;background:${COLORS[i%COLORS.length]};flex-shrink:0"></div>${x.label}: <strong style="color:var(--text)">${x.value}</strong></div>`).join('');
}

  if (filterTeam!=='all') workers = workers.filter(w=>w.team===filterTeam);

  if (sortBy==='units') workers.sort((a,b)=>d.worklog.filter(l=>l.workerId===b.id).reduce((s,l)=>s+l.units,0)-d.worklog.filter(l=>l.workerId===a.id).reduce((s,l)=>s+l.units,0));
  else if (sortBy==='present') workers.sort((a,b)=>d.attendance.filter(x=>x.workerId===b.id&&x.status==='Present').length-d.attendance.filter(x=>x.workerId===a.id&&x.status==='Present').length);
  else workers.sort((a,b)=>a.name.localeCompare(b.name));

async function saveGRN() {
  const supplier=document.getElementById('grn-supplier').value.trim();
  const invoice=document.getElementById('grn-invoice').value.trim();
  const date=document.getElementById('grn-date').value;
  const clientRaw=document.getElementById('grn-client').value;
  const itemVal=document.getElementById('grn-item').value;
  const qty=Number(document.getElementById('grn-qty').value);
  const unit=document.getElementById('grn-unit').value;
  const remarks=document.getElementById('grn-remarks').value.trim();
  if(!supplier){alert('Please enter supplier name.');return;}
  if(!clientRaw){alert('Please select a client.');return;}
  if(!itemVal){alert('Please select an item.');return;}
  if(!qty||qty<=0){alert('Please enter a valid quantity.');return;}
  const clientName=clientRaw==='__shared__'?'':clientRaw;
  showLoading('Saving GRN…');
  const d=await getData(); let itemId,itemName;
  if(itemVal==='__new__'){
    const newName=document.getElementById('grn-newitem').value.trim();
    if(!newName){hideLoading();alert('Enter the new item name.');return;}
    itemId='I'+uid(); itemName=newName;
    d.inventory.push({id:itemId,item:itemName,stock:qty,unit,minLevel:10,company:clientName});
  } else {
    const pts=itemVal.split(':'); itemId=pts[0]; itemName=pts[1];
    const inv=d.inventory.find(i=>i.id===itemId);
    if(inv){inv.stock+=qty; inv.company=clientName;}
  }
  if(!d.grn_receipts) d.grn_receipts=[];
  let dispatchLocation='';
  if(navigator.geolocation){try{const pos=await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{timeout:5000}));dispatchLocation=`${pos.coords.latitude.toFixed(5)},${pos.coords.longitude.toFixed(5)}`;}catch(e){dispatchLocation='Location denied';}}
  d.grn_receipts.push({id:'GRN'+uid(),date,supplier,invoice,itemId,itemName,qty,unit,remarks,client:clientName,officer:currentUser.name,location:dispatchLocation,grnConfirmed:true});
  await saveData(d);
  await logAction('GRN Confirmed', `${qty} ${unit} of ${itemName} from ${supplier}`);
  hideLoading();
  showToast(`✅ GRN Confirmed — ${qty} ${unit} of ${itemName}!`); renderGRNReceive();
}

async function exportCSV(type) {
  showLoading('Building CSV…'); const d=await getData(); hideLoading();
  let rows=[],filename='';
  if(type==='attendance'){filename='mpkp_attendance.csv';rows=[['Date','Worker','Team','Status','In Time','Out Time','Supervisor']];d.attendance.forEach(r=>rows.push([r.date,r.workerName,r.team,r.status,r.inTime||'',r.outTime||'',r.supervisor]));}
  else if(type==='worklog'){filename='mpkp_worklog.csv';rows=[['Date','Worker','Team','Task','Part','Units','Hours','Rating','Notes','Supervisor']];d.worklog.forEach(r=>rows.push([r.date,r.workerName,r.team,r.task,r.part||'',r.units,r.hours,r.rating||'',r.notes||'',r.supervisor]));}
  else if(type==='workers'){filename='mpkp_workers.csv';rows=[['Name','Team','Skill','Salary','Days Present','Days Absent','Total Units','Total Hours']];d.workers.forEach(w=>{const present=d.attendance.filter(a=>a.workerId===w.id&&a.status==='Present').length,absent=d.attendance.filter(a=>a.workerId===w.id&&a.status==='Absent').length,units=d.worklog.filter(l=>l.workerId===w.id).reduce((s,l)=>s+l.units,0),hours=d.worklog.filter(l=>l.workerId===w.id).reduce((s,l)=>s+l.hours,0);rows.push([w.name,w.team,w.skill,w.salary||0,present,absent,units,Math.round(hours)]);});}
  else if(type==='inventory'){filename='mpkp_inventory.csv';rows=[['Item','Company','Stock','Unit','Min Level','Status']];d.inventory.forEach(i=>rows.push([i.item,i.company||'Shared',i.stock,i.unit,i.minLevel,i.stock<=i.minLevel*0.5?'Critical':i.stock<=i.minLevel?'Low':'OK']));}
  else if(type==='inventory_usage'){filename='mpkp_inventory_usage.csv';rows=[['Date','Item','Qty Used','Supervisor','Team','Purpose']];d.inventory_usage.forEach(r=>rows.push([r.date,r.itemName,r.qty,r.supervisor,r.team,r.purpose||'']));}
  else if(type==='grn_receipts'){filename='mpkp_dispatch_receipts.csv';rows=[['Date','Supplier','Invoice','Client','Item','Qty','Unit','Officer','Remarks']];(d.grn_receipts||[]).forEach(r=>rows.push([r.date,r.supplier,r.invoice||'',r.client||'Shared',r.itemName,r.qty,r.unit,r.officer,r.remarks||'']));}
  else if(type==='queries'){filename='mpkp_queries.csv';rows=[['Date','Supervisor','Team','Type','Priority','Status','Description']];d.queries.forEach(r=>rows.push([r.date,r.supervisor,r.team,r.type,r.priority,r.status,r.desc]));}
  else if(type==='expenses'){filename='mpkp_expenses.csv';rows=[['Date','Supervisor','Team','Category','Amount','Description','Status']];(d.expenses||[]).forEach(e=>rows.push([e.date,e.supervisor,e.team,e.category,e.amount,e.desc||'',e.approved?'Approved':e.rejected?'Rejected':'Pending']));}
  else if(type==='action_logs'){filename='mpkp_location_log.csv';rows=[['Date','Time','Supervisor','Company','Team','Action','Details','Latitude','Longitude','Location','Google Maps']];(d.action_logs||[]).slice().reverse().forEach(l=>rows.push([l.date,l.time,l.supervisor,l.company||'—',l.team,l.action,l.details||'',l.lat||'',l.lng||'',l.location||'',l.mapUrl||'']));}
  if(!rows.length){showToast('No data');return;}
  downloadCSV(rows,filename); showToast(`Downloaded ${filename}`);
}

function downloadCSV(rows,filename) {
  const csv=rows.map(r=>r.map(v=>{const s=String(v==null?'':v);return s.includes(',')||s.includes('"')||s.includes('\n')?`"${s.replace(/"/g,'""')}"`:s;}).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download=filename; a.click(); setTimeout(()=>URL.revokeObjectURL(url),1000);
}

async function savePartPrice(partId) {
  const price=Number(document.getElementById('price-'+partId).value)||0;
  showLoading('Saving…'); const d=await getData(); const part=d.parts.find(p=>p.id===partId);
  if(part) part.price=price; await saveData(d); hideLoading(); showToast(`₹${price}/unit saved`); renderPartsPricing();
}
async function deletePart(partId) {
  if(!confirm('Remove?')) return;
  showLoading('Removing…'); const d=await getData(); d.parts=d.parts.filter(p=>p.id!==partId);
  await saveData(d); hideLoading(); showToast('Removed'); renderPartsPricing();
}
async function addNewPart() {
  const name=document.getElementById('new-part-name').value.trim();
  const price=Number(document.getElementById('new-part-price').value)||0;
  const company=document.getElementById('new-part-company').value||'';
  if(!name){alert('Enter a part name.');return;}
  showLoading('Saving…'); const d=await getData(); if(!d.parts) d.parts=[];
  if(d.parts.find(p=>p.name.toLowerCase()===name.toLowerCase()&&(p.company||'')===(company||''))){hideLoading();alert('Already exists.');return;}
  d.parts.push({id:'P'+uid(),name,price,company}); await saveData(d); hideLoading(); showToast(`${name} added!`); window._ppCompany=company; renderPartsPricing();
}

function filterBcRecipients(company) {
  getData().then(d=>{
    const sel=document.getElementById('bc-to'); if(!sel) return;
    if(!company){sel.innerHTML=['<option value="__all__">📢 All Supervisors</option>',...d.supervisors.map(s=>`<option value="${s.name}">${s.name} (${s.company||'—'} · Team ${s.team})</option>`)].join('');}
    else{const filtered=d.supervisors.filter(s=>s.company===company);sel.innerHTML=[`<option value="__company__${company}">🏭 All ${company} Supervisors (${filtered.length})</option>`,...filtered.map(s=>`<option value="${s.name}">${s.name} · Team ${s.team}</option>`)].join('');}
  });
}
async function sendBroadcast(asDraft=false) {
  const to=document.getElementById('bc-to').value, type=document.getElementById('bc-type').value, priority=document.getElementById('bc-priority').value;
  const subject=document.getElementById('bc-subject').value.trim(), body=document.getElementById('bc-body').value.trim();
  const companyFilter=document.getElementById('bc-company').value;
  if(!to){alert('Select recipient.');return;} if(!body){alert('Write a message.');return;}
  showLoading(asDraft?'Saving…':'Sending…'); const d=await getData();
  if(!d.broadcasts) d.broadcasts=[];
  const now=new Date();
  d.broadcasts.push({id:'B'+uid(),date:today(),time:now.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}),to:to.startsWith('__company__')?'__all__':to,toCompany:to.startsWith('__company__')?to.replace('__company__',''):(companyFilter||''),type,priority,subject,body,from:'Admin',draft:!!asDraft,readBy:[]});
  await saveData(d); hideLoading(); showToast(asDraft?'Draft saved!':'Sent!'); refreshActivityBadges(); renderBroadcast();
}
async function sendDraft(idx) {
  showLoading('Sending…'); const d=await getData(); d.broadcasts[idx].draft=false; d.broadcasts[idx].date=today(); d.broadcasts[idx].time=new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
  await saveData(d); hideLoading(); showToast('Sent!'); renderBroadcast();
}
async function deleteBroadcast(idx) {

}

async function saveSalary(type, id) {
  showLoading('Saving salary…');
  const d = await getData();
  let el, person;
  if (type==='worker') { el=document.getElementById('salary-w-'+id); person=d.workers.find(w=>w.id===id); }
  else if (type==='supervisor') { el=document.getElementById('salary-s-'+id); person=d.supervisors.find(s=>s.id===id); }
  else { el=document.getElementById('salary-g-'+id); person=(d.grn_officers||[]).find(g=>g.id===id); }
  if (person && el) { person.salary = Number(el.value)||0; }
  await saveData(d);
  hideLoading();
  showToast('Salary saved!');
}

async function allocatePettyCash(supId, supName) {
  const amountEl = document.getElementById('pc-amount-'+supId);
  const noteEl = document.getElementById('pc-note-'+supId);
  const amount = Number(amountEl.value);
  if (!amount||amount<=0) { alert('Enter a valid amount.'); return; }
  showLoading('Allocating…');
  const d = await getData();
  if (!d.petty_cash_allocations) d.petty_cash_allocations = [];
  d.petty_cash_allocations.push({id:'PC'+uid(), supervisorName:supName, amount, date:today(), note:noteEl?.value||'', allocatedBy:'Admin'});
  await saveData(d);
  hideLoading();
  showToast(`₹${amount} allocated to ${supName}!`);
  renderSettings();
}

async function approveExpense(idx, approve) {
  showLoading(approve?'Approving…':'Rejecting…');
  const d = await getData();
  if (d.expenses && d.expenses[idx]) {
    d.expenses[idx].approved = approve;
    d.expenses[idx].rejected = !approve;
  }
  await saveData(d);
  hideLoading();
  showToast(approve?'Expense approved!':'Expense rejected');
  renderSettings();
}

async function addSkill() {
  const name = document.getElementById('new-skill-name').value.trim();
  if (!name) { alert('Enter a skill name.'); return; }
  showLoading('Saving…');
  const d = await getData();
  if (!d.skills) d.skills = [];
  if (d.skills.includes(name)) { hideLoading(); alert('Skill already exists.'); return; }
  d.skills.push(name);
  await saveData(d);
  hideLoading();
  showToast(`${name} added!`);
  renderSettings();
}
async function deleteSkill(idx) {
  if (!confirm('Remove this skill?')) return;
  showLoading('Removing…');
  const d = await getData();
  if (!d.skills) d.skills = [];
  d.skills.splice(idx, 1);
  await saveData(d);
  hideLoading();
  showToast('Skill removed');
  renderSettings();
}

async function addClient() {
  const name=document.getElementById('new-client-name').value.trim();
  if(!name){alert('Enter a client name.');return;}
  showLoading('Saving…'); const d=await getData();
  if(!d.clients) d.clients=[];
  if(d.clients.find(c=>c.toLowerCase()===name.toLowerCase())){hideLoading();alert('Already exists.');return;}
  d.clients.push(name); await saveData(d); hideLoading(); showToast(`${name} added!`); renderSettings();
}
async function renameClient(idx) {
  const newName=document.getElementById('client-edit-'+idx).value.trim();
  if(!newName){alert('Enter a name.');return;}
  showLoading('Renaming…'); const d=await getData();
  const oldName=d.clients[idx]; d.clients[idx]=newName;
  d.supervisors.forEach(s=>{if(s.company===oldName) s.company=newName;});
  d.inventory.forEach(i=>{if(i.company===oldName) i.company=newName;});
  if(d.parts) d.parts.forEach(p=>{if(p.company===oldName) p.company=newName;});
  if(d.grn_receipts) d.grn_receipts.forEach(r=>{if(r.client===oldName) r.client=newName;});
  await saveData(d); hideLoading(); showToast(`Renamed to ${newName}!`); renderSettings();
}
async function removeClient(idx) {
  const d=await getData(); if(!d.clients) d.clients=[];
  const name=d.clients[idx];
  const inUse=d.supervisors.some(s=>s.company===name)||d.inventory.some(i=>i.company===name);
  if(inUse&&!confirm(`"${name}" is still in use. Remove anyway?`)) return;
  showLoading('Removing…'); d.clients.splice(idx,1);
  d.supervisors.forEach(s=>{if(s.company===name) s.company='';});
  d.inventory.forEach(i=>{if(i.company===name) i.company='';});
  if(d.parts) d.parts.forEach(p=>{if(p.company===name) p.company='';});
  await saveData(d); hideLoading(); showToast(`${name} removed`); renderSettings();
}

async function addSupervisor() {
  const name=document.getElementById('ns-name').value.trim(), company=document.getElementById('ns-company').value, team=document.getElementById('ns-team').value, pw=document.getElementById('ns-pw').value.trim();
  const customId=(document.getElementById('ns-userid')?.value||'').trim().toUpperCase();
  if(!name||!team){alert('Fill Name and Team.');return;}
  if(!pw||pw.length<4){alert('Password must be at least 4 characters.');return;}
  showLoading('Saving…'); const d=await getData();
  if(d.supervisors.find(s=>s.name===name)){hideLoading();alert('Supervisor with this name exists.');return;}
  const passwords=await getPasswords();
  const userId=customId&&!passwords[customId]?customId:genUserId('SUP',passwords);
  if(customId&&passwords[customId]){hideLoading();alert('User ID already taken. Leave blank for auto.');return;}
  d.supervisors.push({id:'S'+uid(),name,team,company:company||'',salary:0}); await saveData(d);
  passwords[userId]={password:pw,role:'supervisor',name};
  await savePasswords(passwords);
  hideLoading(); showToast(`${name} added! User ID: ${userId}`); renderSettings();
}
async function deleteSupervisor(id) {
  if(!confirm('Remove this supervisor?')) return;
  showLoading('Removing…'); const d=await getData();
  const sup=d.supervisors.find(s=>s.id===id); d.supervisors=d.supervisors.filter(s=>s.id!==id);
  await saveData(d);
  if(sup){
    const passwords=await getPasswords();
    const key=Object.keys(passwords).find(k=>passwords[k].role==='supervisor'&&passwords[k].name===sup.name);
    if(key) delete passwords[key];
    await savePasswords(passwords);
  }
  hideLoading(); showToast('Removed'); renderSettings();
}

// Helper: generate a unique User ID with a prefix
function genUserId(prefix, passwords) {
  let n=1;
  while(passwords[prefix+String(n).padStart(3,'0')]) n++;
  return prefix+String(n).padStart(3,'0');
}

  const safeKey = chk.dataset.safekey;
  const visual = document.getElementById('groupchk-visual-'+safeKey);

  if (chk.checked) {
    if(visual){visual.style.background='var(--green)';visual.style.borderColor='var(--green)';visual.textContent='✓';visual.style.color='#fff';}
    if(wrap){wrap.style.borderColor='rgba(34,200,122,0.4)';wrap.style.background='rgba(34,200,122,0.04)';}
  } else {

    if(wrap){wrap.style.borderColor='var(--border)';wrap.style.background='var(--bg3)';}

async function saveProdConfirmations() {
  const checked = [...document.querySelectorAll('[id^="groupchk-"]:not([id^="groupchk-visual"])')].filter(c=>c.tagName==='INPUT'&&c.type==='checkbox'&&c.checked);
  if(!checked.length){alert('Please confirm at least one entry.');return;}
  showLoading(`Saving ${checked.length} confirmation(s)…`);
  const d = await getData();
  if(!d.prod_confirmations) d.prod_confirmations=[];
  const now = new Date();
  const dateStr = now.toISOString().slice(0,10);
  const timeStr = now.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});

  let savedCount=0;
  checked.forEach(chk=>{
    const safeKey = chk.dataset.safekey;
    const noteEl = document.getElementById('groupnote-'+safeKey);
    const note = noteEl?.value?.trim()||'';
    let entries = [];
    try { entries = JSON.parse(chk.dataset.entries||'[]'); } catch(e){}
    entries.forEach(e=>{
      const lid = e.lid;
      const log = d.worklog[e.idx];
      if(!log) return;
      if(d.prod_confirmations.find(c=>c.worklogId===lid&&c.confirmedBy===currentUser.name)) return;
      d.prod_confirmations.push({
        id:'CONF'+uid(),
        worklogId: lid,
        confirmedBy: currentUser.name,
        company: currentUser.company||'',
        date: dateStr,
        time: timeStr,
        ts: now.toISOString(),
        workerName: log.workerName,
        part: log.part||'',
        units: log.units,
        totalQty: log.units,
        task: log.task,
        team: log.team,
        supervisor: log.supervisor,
        note: note,
        seenByAdmin: false,
      });
      savedCount++;
    });
  });

  if(d.prod_confirmations.length > 1000) d.prod_confirmations = d.prod_confirmations.slice(-1000);
  await saveData(d);
  hideLoading();
  showToast(`✅ ${savedCount} confirmation(s) saved!`);
  refreshActivityBadges();
  renderProdConfirm();
}

      <div style="display:flex;gap:6px">
        <button onclick="window._locFilterSup='${s.name}';window._locFilterType='all';window._locFilterDate='';renderLocationLog()" style="flex:1;background:rgba(79,142,247,0.1);border:1px solid rgba(79,142,247,0.25);border-radius:7px;padding:5px 0;color:var(--accent);font-size:11px;cursor:pointer;font-family:DM Sans,sans-serif">All Logs (${supLogs.length})</button>
        <button onclick="window._locFilterSup='${s.name}';window._locFilterType='all';window._locFilterDate='${today()}';renderLocationLog()" style="flex:1;background:rgba(34,200,122,0.08);border:1px solid rgba(34,200,122,0.2);border-radius:7px;padding:5px 0;color:var(--green);font-size:11px;cursor:pointer;font-family:DM Sans,sans-serif">Today (${todayCount})</button>
      </div>
    </div>`;
  }).join('');

  const actionColors = { 'Login':'var(--accent)', 'Attendance Saved':'var(--green)', 'Work Log Saved':'var(--teal)', 'Inventory Used':'var(--amber)', 'Expense Logged':'#a855f7', 'Query Submitted':'var(--red)', 'GRN Confirmed':'var(--teal)' };
  const actionIcons  = { 'Login':'🔐', 'Attendance Saved':'✅', 'Work Log Saved':'📝', 'Inventory Used':'📦', 'Expense Logged':'💸', 'Query Submitted':'💬', 'GRN Confirmed':'📥' };

  const timelineHtml = todayLogs.length ? todayLogs.map(l => {
    const col = actionColors[l.action] || 'var(--text2)';
    const ico = actionIcons[l.action]  || '•';
    const locLink = l.mapUrl
      ? `<a href="${l.mapUrl}" target="_blank" style="color:var(--accent);font-size:10px;text-decoration:none;background:rgba(79,142,247,0.1);border:1px solid rgba(79,142,247,0.2);border-radius:5px;padding:2px 7px;white-space:nowrap">📍 Map</a>`
      : `<span style="font-size:10px;color:var(--text3)">📍 No location</span>`;
    return `
    <div style="display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--border)">
      <div style="width:32px;height:32px;border-radius:50%;background:${col}20;border:1.5px solid ${col};display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0">${ico}</div>
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:2px">
          <span style="font-size:12px;font-weight:600;color:var(--text)">${l.supervisor}</span>
          <span style="display:inline-block;font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;background:${col}18;color:${col}">${l.action}</span>
          <span style="font-size:11px;color:var(--text3);margin-left:auto">${l.time}</span>
        </div>
        <div style="font-size:11px;color:var(--text2);margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${l.details||'—'}</div>
        <div style="display:flex;align-items:center;gap:8px">${locLink}${l.team&&l.team!=='—'?`<span style="font-size:10px;color:var(--text3)">Team ${l.team}</span>`:''}</div>
      </div>
    </div>`;
  }).join('') : '<div class="empty-state"><div class="es-icon">🌅</div>No activity logged today yet.<br><span style="font-size:11px;display:block;margin-top:4px">Actions are recorded when supervisors log attendance, work, inventory, expenses, or queries.</span></div>';

  const supOptions  = d.supervisors.map(s=>`<option value="${s.name}" ${filterSup===s.name?'selected':''}>${s.name}</option>`).join('');
  const typeOptions = actionTypes.map(t=>`<option value="${t}" ${filterType===t?'selected':''}>${t}</option>`).join('');

  const tableRows = filtered.slice(0,200).map(l => {
    const col = actionColors[l.action] || 'var(--text2)';
    const ico = actionIcons[l.action]  || '•';
    const locCell = l.mapUrl
      ? `<a href="${l.mapUrl}" target="_blank" style="color:var(--accent);font-size:11px;text-decoration:none">🗺️ Map</a>`
      : `<span style="color:var(--text3);font-size:11px">—</span>`;
    const coordCell = l.lat
      ? `<span style="font-family:'DM Mono',monospace;font-size:10px;color:var(--text3)">${l.lat.toFixed(5)},<br>${l.lng.toFixed(5)}</span>`
      : `<span style="color:var(--text3)">—</span>`;
    return `<tr>
      <td style="white-space:nowrap"><div style="font-size:11px;color:var(--text3)">${l.date}</div><div style="font-size:12px;color:var(--text2);font-weight:500">${l.time}</div></td>
      <td><div style="font-size:12px;font-weight:600;color:var(--text)">${l.supervisor}</div><div style="font-size:10px;color:var(--text3)">${l.company||'—'} · Team ${l.team}</div></td>
      <td><span style="display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;background:${col}18;color:${col};white-space:nowrap">${ico} ${l.action}</span></td>
      <td style="max-width:200px;font-size:11px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${l.details||'—'}</td>
      <td>${coordCell}</td>
      <td>${locCell}</td>
    </tr>`;
  }).join('');

  setContent(`
    <div class="page active">
      <div class="page-title">📍 Supervisor Location Log</div>
      <div class="page-sub">Every action supervisors take — with exact timestamp, GPS coordinates and activity type</div>

      <div class="stats-grid" style="margin-bottom:1.5rem">
        <div class="stat blue"><div class="stat-label">Total Logs</div><div class="stat-val">${d.action_logs.length}</div><div class="stat-sub">all time</div></div>
        <div class="stat green"><div class="stat-label">Today's Actions</div><div class="stat-val">${todayLogs.length}</div><div class="stat-sub">${activeSups} active supervisor(s)</div></div>
        <div class="stat"><div class="stat-label">With GPS</div><div class="stat-val">${withLoc}</div><div class="stat-sub">location captured</div></div>
        <div class="stat ${locDenied>0?'amber':'green'}"><div class="stat-label">GPS Denied</div><div class="stat-val">${locDenied}</div><div class="stat-sub">no coordinates</div></div>
      </div>

      <div class="card" style="margin-bottom:1rem">
        <div class="card-title"><span class="ct-icon">🧑‍💼</span>Supervisor Status — Live</div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px">
          ${supCards || '<div class="empty-state">No supervisors found</div>'}
        </div>
      </div>

      <div class="card" style="margin-bottom:1rem">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:8px">
          <div class="card-title" style="margin-bottom:0"><span class="ct-icon">⏱️</span>Today's Activity Timeline</div>
          <button onclick="exportLocationLog()" style="background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);padding:6px 14px;color:var(--text2);font-family:DM Sans,sans-serif;font-size:12px;cursor:pointer">⬇️ Export CSV</button>
        </div>
        ${timelineHtml}
      </div>

      <div class="card">
        <div class="card-title" style="margin-bottom:0.75rem"><span class="ct-icon">📋</span>Full Action Log</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1rem;align-items:center">
          <select onchange="window._locFilterSup=this.value;renderLocationLog()" style="background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);padding:7px 11px;color:var(--text);font-family:DM Sans,sans-serif;font-size:12px">
            <option value="all" ${filterSup==='all'?'selected':''}>All Supervisors</option>${supOptions}
          </select>
          <select onchange="window._locFilterType=this.value;renderLocationLog()" style="background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);padding:7px 11px;color:var(--text);font-family:DM Sans,sans-serif;font-size:12px">
            <option value="all" ${filterType==='all'?'selected':''}>All Actions</option>${typeOptions}
          </select>
          <input type="date" value="${filterDate}" onchange="window._locFilterDate=this.value;renderLocationLog()" style="background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);padding:7px 11px;color:var(--text);font-family:DM Sans,sans-serif;font-size:12px">
          <button onclick="window._locFilterSup='all';window._locFilterType='all';window._locFilterDate='';renderLocationLog()" style="background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);padding:7px 14px;color:var(--text2);font-family:DM Sans,sans-serif;font-size:12px;cursor:pointer">↺ Reset</button>
          <span style="font-size:12px;color:var(--text3);margin-left:auto">${filtered.length} records${filtered.length>200?' (showing 200)':''}</span>
        </div>
        ${filtered.length ? `
        <div style="overflow-x:auto">
          <table class="data-table">
            <thead><tr><th>Date / Time</th><th>Supervisor</th><th>Action</th><th>Details</th><th>GPS</th><th>Map</th></tr></thead>
            <tbody>${tableRows}</tbody>
          </table>
        </div>` : '<div class="empty-state"><div class="es-icon">📍</div>No logs match your filters.<br><span style="font-size:11px;margin-top:4px;display:block">GPS + action logs are captured automatically when supervisors save attendance, work logs, inventory, expenses or queries.</span></div>'}
      </div>
    </div>`);
}

async function exportLocationLog() {
  showLoading('Building CSV…');
  const d = await getData();
  if (!d.action_logs || !d.action_logs.length) { hideLoading(); showToast('No logs yet'); return; }
  const rows = [['Date','Time','Supervisor','Company','Team','Action','Details','Latitude','Longitude','Google Maps']];
  d.action_logs.slice().reverse().forEach(l => {
    rows.push([l.date, l.time, l.supervisor, l.company||'—', l.team, l.action, l.details||'', l.lat||'', l.lng||'', l.mapUrl||'']);
  });
  downloadCSV(rows, 'mpkp_location_log.csv');
  hideLoading();
  showToast('Location log exported!');
}

// ===================== COLLAPSIBLE SECTIONS =====================
const _collapseState = {};
function toggleCollapse(id) {
  const body = document.getElementById('collapse-'+id);
  const btn  = document.getElementById('ctoggle-'+id);
  if (!body) return;
  const isCollapsed = body.classList.contains('collapsed');
  if (isCollapsed) {
    body.classList.remove('collapsed');
    body.style.maxHeight = body.scrollHeight + 'px';
    setTimeout(() => { body.style.maxHeight = 'none'; }, 310);
    if (btn) btn.innerHTML = '▲ Collapse';
    _collapseState[id] = false;
  } else {
    body.style.maxHeight = body.scrollHeight + 'px';
    requestAnimationFrame(() => { body.classList.add('collapsed'); body.style.maxHeight = '0'; });
    if (btn) btn.innerHTML = '▼ Expand';
    _collapseState[id] = true;
  }
}
function initCollapsible(id, startCollapsed) {
  const body = document.getElementById('collapse-'+id);
  const btn  = document.getElementById('ctoggle-'+id);
  if (!body) return;
  if (startCollapsed) {
    body.classList.add('collapsed');
    body.style.maxHeight = '0';
    if (btn) btn.innerHTML = '▼ Expand';
    _collapseState[id] = true;
  } else {
    body.classList.add('expanded');
    body.style.maxHeight = 'none';
    if (btn) btn.innerHTML = '▲ Collapse';
    _collapseState[id] = false;
  }
}

</script>
