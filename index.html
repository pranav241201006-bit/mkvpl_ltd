<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorkTrack — Team Manager</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- EXPORT LIBRARIES -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<style>
:root {
  --bg: #0f1117; --bg2: #161b27; --bg3: #1e2535; --bg4: #252d40;
  --border: rgba(255,255,255,0.08); --border2: rgba(255,255,255,0.14);
  --text: #e8eaf0; --text2: #8b90a0; --text3: #555c70;
  --accent: #4f8ef7; --accent2: #3a7ae8; --green: #22c87a; --green2: #1aad68;
  --amber: #f59e0b; --red: #ef4444; --teal: #14b8a6; --radius: 10px; --radius-lg: 14px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; }

/* LOGIN */
#login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; }
.login-box { background: var(--bg2); border: 1px solid var(--border2); border-radius: 20px; padding: 2.5rem; width: 100%; max-width: 400px; }
.login-logo { font-size: 22px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
.login-logo span { color: var(--accent); }
.login-sub { color: var(--text2); font-size: 13px; margin-bottom: 2rem; }
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 12px; color: var(--text2); margin-bottom: 6px; font-weight: 500; }
.form-group select, .form-group input { width: 100%; background: var(--bg3); border: 1px solid var(--border2); border-radius: var(--radius); padding: 10px 12px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14px; outline: none; transition: border-color 0.2s; }
.form-group select:focus, .form-group input:focus { border-color: var(--accent); }
.form-group select option { background: var(--bg3); }
.btn-primary { width: 100%; background: var(--accent); color: #fff; border: none; border-radius: var(--radius); padding: 11px; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer; }
.btn-primary:hover { background: var(--accent2); }

/* LAYOUT */
#app { display: none; min-height: 100vh; }
.topbar { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 0 1.5rem; display: flex; align-items: center; height: 56px; gap: 16px; position: sticky; top: 0; z-index: 100; }
.topbar-logo { font-size: 16px; font-weight: 600; }
.topbar-logo span { color: var(--accent); }
.topbar-user { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.user-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: #fff; }
.user-name { font-size: 13px; color: var(--text2); }
.logout-btn { background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 5px 12px; color: var(--text2); font-size: 12px; cursor: pointer; }
.logout-btn:hover { color: var(--text); }
.main { display: flex; }
.sidebar { width: 220px; min-height: calc(100vh - 56px); background: var(--bg2); border-right: 1px solid var(--border); padding: 1rem 0; flex-shrink: 0; }
.nav-section { padding: 0 12px; margin-bottom: 1.5rem; }
.nav-section-label { font-size: 10px; color: var(--text3); font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; padding: 0 8px; margin-bottom: 6px; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: var(--radius); cursor: pointer; color: var(--text2); font-size: 13px; font-weight: 400; transition: all 0.15s; margin-bottom: 2px; }
.nav-item:hover { background: var(--bg3); color: var(--text); }
.nav-item.active { background: rgba(79,142,247,0.12); color: var(--accent); }
.nav-icon { font-size: 16px; width: 18px; text-align: center; }
.content { flex: 1; padding: 1.5rem; overflow: auto; }

/* MOBILE BOTTOM NAV */
.mobile-nav { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg2); border-top: 1px solid var(--border2); z-index: 200; padding: 6px 0 8px; }
.mobile-nav-items { display: flex; justify-content: space-around; align-items: center; }
.mnav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 8px; cursor: pointer; color: var(--text3); font-size: 10px; font-weight: 500; border-radius: 8px; min-width: 48px; transition: color 0.15s; }
.mnav-item .mni { font-size: 20px; line-height: 1; }
.mnav-item.active { color: var(--accent); }
.mnav-item:active { background: var(--bg3); }

/* EXPORT BUTTONS */
.export-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1rem; align-items: center; }
.export-bar .export-label { font-size: 11px; color: var(--text3); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; margin-right: 4px; }
.btn-export { display: inline-flex; align-items: center; gap: 6px; border: none; border-radius: var(--radius); padding: 8px 14px; font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 600; cursor: pointer; transition: opacity .15s; white-space: nowrap; }
.btn-export:hover { opacity: .85; }
.btn-xls  { background: rgba(34,200,122,.15); color: var(--green);  border: 1px solid rgba(34,200,122,.3); }
.btn-pdf  { background: rgba(239,68,68,.12);  color: var(--red);    border: 1px solid rgba(239,68,68,.3); }
.btn-full { background: rgba(79,142,247,.12); color: var(--accent); border: 1px solid rgba(79,142,247,.3); }

/* CARDS */
.page { display: none; }
.page.active { display: block; }
.page-title { font-size: 20px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
.page-sub { font-size: 13px; color: var(--text2); margin-bottom: 1.25rem; }
.card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1.25rem; margin-bottom: 1rem; }
.card-title { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 1rem; display: flex; align-items: center; gap: 8px; }
.card-title .ct-icon { font-size: 16px; }

/* STATS */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr)); gap: 12px; margin-bottom: 1.5rem; }
.stat { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1rem 1.25rem; }
.stat-label { font-size: 11px; color: var(--text2); font-weight: 500; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
.stat-val { font-size: 26px; font-weight: 600; color: var(--text); letter-spacing: -0.5px; line-height: 1; }
.stat-sub { font-size: 11px; color: var(--text3); margin-top: 4px; }
.stat.green .stat-val { color: var(--green); }
.stat.amber .stat-val { color: var(--amber); }
.stat.red .stat-val { color: var(--red); }
.stat.blue .stat-val { color: var(--accent); }

/* FORMS */
.form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px,1fr)); gap: 12px; margin-bottom: 14px; }
.field label { display: block; font-size: 11px; color: var(--text2); margin-bottom: 5px; font-weight: 500; }
.field input, .field select, .field textarea { width: 100%; background: var(--bg3); border: 1px solid var(--border2); border-radius: var(--radius); padding: 9px 11px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 13px; outline: none; transition: border-color 0.2s; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
.field select option { background: var(--bg3); }
.field textarea { resize: vertical; min-height: 70px; }
.btn-save { background: var(--green); color: #fff; border: none; border-radius: var(--radius); padding: 10px 20px; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; }
.btn-save:hover { background: var(--green2); }
.btn-secondary { background: var(--bg3); color: var(--text2); border: 1px solid var(--border2); border-radius: var(--radius); padding: 10px 16px; font-family: 'DM Sans', sans-serif; font-size: 13px; cursor: pointer; }

/* TABLE */
.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.data-table th { text-align: left; padding: 8px 12px; color: var(--text3); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid var(--border); }
.data-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); color: var(--text2); vertical-align: middle; }
.data-table tr:last-child td { border-bottom: none; }
.data-table tr:hover td { background: var(--bg3); color: var(--text); }
.badge { display: inline-block; font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 20px; }
.badge-green { background: rgba(34,200,122,0.12); color: var(--green); }
.badge-amber { background: rgba(245,158,11,0.12); color: var(--amber); }
.badge-red { background: rgba(239,68,68,0.12); color: var(--red); }
.badge-blue { background: rgba(79,142,247,0.12); color: var(--accent); }
.badge-gray { background: var(--bg3); color: var(--text2); }
.empty-state { text-align: center; padding: 2.5rem; color: var(--text3); font-size: 13px; }
.empty-state .es-icon { font-size: 32px; margin-bottom: 8px; opacity: 0.4; }

/* TOAST */
.toast { position: fixed; bottom: 80px; right: 16px; background: var(--bg3); border: 1px solid var(--border2); border-radius: var(--radius-lg); padding: 12px 18px; font-size: 13px; color: var(--text); z-index: 999; display: none; align-items: center; gap: 10px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
.toast.show { display: flex; }
.toast-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); flex-shrink: 0; }

/* INVENTORY ALERT */
.alert-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: rgba(239,68,68,0.07); border: 1px solid rgba(239,68,68,0.2); border-radius: var(--radius); margin-bottom: 8px; font-size: 13px; }
.alert-icon { color: var(--red); font-size: 16px; }

/* BAR CHART */
.bar-chart { display: flex; align-items: flex-end; gap: 8px; height: 120px; margin-top: 12px; }
.bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; height: 100%; justify-content: flex-end; }
.bar { width: 100%; border-radius: 4px 4px 0 0; background: var(--accent); transition: height 0.3s ease; min-height: 4px; }
.bar-label { font-size: 10px; color: var(--text3); white-space: nowrap; }
.bar-val { font-size: 11px; color: var(--text2); font-weight: 500; }

/* ATTENDANCE */
.att-worker { background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; display: flex; align-items: center; gap: 10px; }
.att-avatar { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: #fff; flex-shrink: 0; }
.att-name { font-size: 12px; font-weight: 500; color: var(--text); }
.att-status { font-size: 11px; margin-top: 2px; }

/* SETTINGS */
.pw-row { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); flex-wrap:wrap; }
.pw-row:last-child { border-bottom:none; }
.pw-name { min-width:130px; font-size:13px; color:var(--text); font-weight:500; }
.pw-role { font-size:11px; color:var(--text3); }
.btn-del { background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.25); border-radius:7px; padding:4px 10px; color:var(--red); font-size:11px; cursor:pointer; font-family:'DM Sans',sans-serif; white-space:nowrap; }

/* MOBILE */
@media (max-width: 640px) {
  .sidebar { display: none !important; }
  .mobile-nav { display: block; }
  .topbar { padding: 0 1rem; }
  .topbar .user-name { display: none; }
  .content { padding: 1rem; padding-bottom: 80px; }
  .stats-grid { grid-template-columns: 1fr 1fr; }
  .form-row { grid-template-columns: 1fr; }
  .data-table { font-size: 12px; }
  .data-table th, .data-table td { padding: 7px 8px; }
  .toast { bottom: 90px; right: 12px; left: 12px; }
  .export-bar { gap: 6px; }
  .btn-export { font-size: 11px; padding: 7px 10px; }
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">Work<span>Track</span></div>
    <div class="login-sub">Team operations management</div>
    <div class="form-group">
      <label>SELECT YOUR ROLE</label>
      <select id="login-role">
        <option value="">-- Choose role --</option>
        <option value="manager">Manager</option>
        <option value="supervisor">Supervisor</option>
      </select>
    </div>
    <div class="form-group" id="login-name-group" style="display:none">
      <label>YOUR NAME</label>
      <select id="login-name"><option value="">-- Select --</option></select>
    </div>
    <div class="form-group" id="login-pw-group" style="display:none">
      <label>PASSWORD</label>
      <input type="password" id="login-pw" placeholder="Enter your password" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <div id="login-err" style="color:var(--red);font-size:12px;margin-bottom:8px;display:none">❌ Wrong password. Try again.</div>
    <button class="btn-primary" id="login-btn" onclick="doLogin()" style="margin-top:8px" disabled>Connecting to Database...</button>
    <div style="margin-top:14px;background:var(--bg3);border-radius:var(--radius);padding:10px 13px;font-size:12px;color:var(--text2);line-height:1.8">
      <strong style="color:var(--text)">Default Logins:</strong><br>
      Manager: Karen Mills (password: <code style="color:var(--accent)">manager123</code>)<br>
      Supervisors: James Torres (<code style="color:var(--green)">teamA123</code>), Sara Patel (<code style="color:var(--green)">teamB123</code>), Rob Lee (<code style="color:var(--green)">teamC123</code>)
    </div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <div class="topbar-logo">Work<span>Track</span></div>
    <div class="topbar-user">
      <div class="user-avatar" id="tb-avatar">?</div>
      <div class="user-name" id="tb-name">User</div>
      <button class="logout-btn" onclick="doLogout()">Logout</button>
    </div>
  </div>
  <div class="main">
    <div class="sidebar" id="sidebar"></div>
    <div class="content" id="content"></div>
  </div>
  <nav class="mobile-nav" id="mobile-nav">
    <div class="mobile-nav-items" id="mobile-nav-items"></div>
  </nav>
</div>

<div class="toast" id="toast"><div class="toast-dot"></div><span id="toast-msg">Saved!</span></div>

<!-- FIREBASE SDK LIBRARIES -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

// ===================== FIREBASE CONFIGURATION =====================
const firebaseConfig = {
  apiKey: "AIzaSyAwHyR9riUSav5TYuzmFnKw84ZUB5l0cCs",
  authDomain: "worktrack-630af.firebaseapp.com",
  projectId: "worktrack-630af",
  storageBucket: "worktrack-630af.firebasestorage.app",
  messagingSenderId: "262863331596",
  appId: "1:262863331596:web:a68ec14823475ef6a5a929"
};

// Initialize Cloud Services
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// Global state mirrors
let globalData = {};
let globalPasswords = {};
let currentUser = null;

// Built-in initial fallback schemas
const DEFAULT_DATA = {
  workers: [
    {id:'W1',name:'Amit Sharma',team:'A',skill:'Assembly'},
    {id:'W2',name:'Priya Patel',team:'A',skill:'Quality Check'},
    {id:'W3',name:'Ravi Kumar',team:'B',skill:'Packaging'},
    {id:'W4',name:'Sunita Verma',team:'B',skill:'Assembly'},
    {id:'W5',name:'Deepak Singh',team:'C',skill:'Welding'},
    {id:'W6',name:'Kavita Nair',team:'C',skill:'Painting'},
  ],
  supervisors: [
    {id:'S1',name:'James Torres',team:'A'},
    {id:'S2',name:'Sara Patel',team:'B'},
    {id:'S3',name:'Rob Lee',team:'C'},
  ],
  inventory: [
    {id:'I1',item:'Steel Rods',stock:200,unit:'kg',minLevel:50},
    {id:'I2',item:'Paint (Blue)',stock:80,unit:'ltr',minLevel:20},
    {id:'I3',item:'Bolts M10',stock:500,unit:'pcs',minLevel:100},
    {id:'I4',item:'Welding Wire',stock:30,unit:'kg',minLevel:25},
    {id:'I5',item:'Safety Gloves',stock:40,unit:'pcs',minLevel:15},
  ],
  attendance: [], worklog: [], inventory_usage: [], queries: [],
};

const DEFAULT_PASSWORDS = {
  'manager:Karen Mills':    'manager123',
  'supervisor:James Torres':'teamA123',
  'supervisor:Sara Patel':  'teamB123',
  'supervisor:Rob Lee':     'teamC123',
};

// Real-Time Cloud Sync Handler
async function syncFromFirebase() {
  try {
    const dataDoc = await getDoc(doc(db, "worktrack", "app_data"));
    const passDoc = await getDoc(doc(db, "worktrack", "passwords"));
    
    if (dataDoc.exists()) {
      globalData = dataDoc.data();
    } else {
      await setDoc(doc(db, "worktrack", "app_data"), DEFAULT_DATA);
      globalData = JSON.parse(JSON.stringify(DEFAULT_DATA));
    }
    
    if (passDoc.exists()) {
      globalPasswords = passDoc.data();
    } else {
      await setDoc(doc(db, "worktrack", "passwords"), DEFAULT_PASSWORDS);
      globalPasswords = JSON.parse(JSON.stringify(DEFAULT_PASSWORDS));
    }
    
    const loginBtn = document.getElementById('login-btn');
    if(loginBtn) {
      loginBtn.textContent = "Enter App";
      loginBtn.disabled = false;
    }
  } catch (error) {
    console.error("Sync Failure: ", error);
    alert("Could not connect to live cloud database. Check Firestore Test Rules permissions.");
  }
}

async function writeDataToFirebase() {
  await setDoc(doc(db, "worktrack", "app_data"), globalData);
}

async function writePasswordsToFirebase() {
  await setDoc(doc(db, "worktrack", "passwords"), globalPasswords);
}

// Kickstart connection
syncFromFirebase();

// Bind Actions to Global Scope
window.doLogin = () => {
  const role = document.getElementById('login-role').value;
  const nameVal = document.getElementById('login-name').value;
  const pw = document.getElementById('login-pw').value;
  if (!role || !nameVal) { alert('Please select role and name.'); return; }
  if (!pw) { alert('Please enter your password.'); return; }
  const parts = nameVal.split(':');
  const name = parts[1];
  
  if (globalPasswords[`${parts[0]}:${name}`] !== pw) {
    document.getElementById('login-err').style.display = 'block';
    document.getElementById('login-pw').value = '';
    return;
  }
  document.getElementById('login-err').style.display = 'none';
  currentUser = { role: parts[0], name, team: parts[2] || null };
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('tb-name').textContent = currentUser.name;
  document.getElementById('tb-avatar').textContent = currentUser.name.split(' ').map(w=>w[0]).join('').slice(0,2);
  buildSidebar();
  showPage(currentUser.role === 'manager' ? 'dashboard' : 'attendance');
};

window.doLogout = () => {
  currentUser = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('login-role').value = '';
  document.getElementById('login-name-group').style.display = 'none';
  document.getElementById('login-pw-group').style.display = 'none';
  document.getElementById('login-err').style.display = 'none';
  syncFromFirebase();
};

// ===================== DESKTOP AND MOBILE CORE LAYOUTS =====================
const MANAGER_NAV = [
  {id:'dashboard',    icon:'📊', label:'Dashboard'},
  {id:'production',   icon:'🏭', label:'Production'},
  {id:'workers',      icon:'👷', label:'Workers'},
  {id:'inventory_view',icon:'📦',label:'Inventory'},
  {id:'queries_view', icon:'📋', label:'Queries'},
  {id:'settings',     icon:'⚙️', label:'Settings'},
];
const SUPERVISOR_NAV = [
  {id:'attendance',  icon:'✅', label:'Attendance'},
  {id:'worklog',     icon:'📝', label:'Work Log'},
  {id:'inv_use',     icon:'🔧', label:'Inventory'},
  {id:'queries_add', icon:'💬', label:'Queries'},
];

function buildSidebar() {
  const nav = currentUser.role === 'manager' ? MANAGER_NAV : SUPERVISOR_NAV;
  const label = currentUser.role === 'manager' ? 'Manager' : `Supervisor · Team ${currentUser.team}`;
  let sHtml = `<div class="nav-section"><div class="nav-section-label">${label}</div>`;
  nav.forEach(n => { sHtml += `<div class="nav-item" id="nav-${n.id}"><span class="nav-icon">${n.icon}</span>${n.label}</div>`; });
  sHtml += '</div>';
  document.getElementById('sidebar').innerHTML = sHtml;
  
  nav.forEach(n => {
    document.getElementById(`nav-${n.id}`).addEventListener('click', () => showPage(n.id));
  });

  let mHtml = '';
  nav.forEach(n => { mHtml += `<div class="mnav-item" id="mnav-${n.id}"><span class="mni">${n.icon}</span>${n.label}</div>`; });
  document.getElementById('mobile-nav-items').innerHTML = mHtml;
  nav.forEach(n => {
    document.getElementById(`mnav-${n.id}`).addEventListener('click', () => showPage(n.id));
  });
}

async function showPage(id) {
  await syncFromFirebase(); // Fetch fresh data changes instantly before loading view panels
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.mnav-item').forEach(el => el.classList.remove('active'));
  const navEl = document.getElementById('nav-'+id);
  const mnavEl = document.getElementById('mnav-'+id);
  if (navEl) navEl.classList.add('active');
  if (mnavEl) mnavEl.classList.add('active');
  const renderers = {
    dashboard: renderDashboard, production: renderProduction, workers: renderWorkers,

function setContent(html) { document.getElementById('content').innerHTML = html; }

function showToast(msg) {
  const t = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function today() { return new Date().toISOString().slice(0,10); }
function fmtDate(d) { if(!d) return ''; return new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short'}); }
function avatarColor(i) { return ['#4f8ef7','#22c87a','#f59e0b','#ef4444','#14b8a6','#a855f7','#ec4899','#f97316'][i%8]; }
function uid() { return Math.random().toString(36).slice(2,8).toUpperCase(); }

function exportBtn(xlsFn, pdfFn) {
  return `<div class="export-bar">
    <span class="export-label">Export Data:</span>
    <button class="btn-export btn-xls" id="exp-xls-btn">📊 Excel File</button>
    <button class="btn-export btn-pdf" id="exp-pdf-btn">📄 PDF File</button>
  </div>`;
}
function bindExportClicks(xlsFn, pdfFn) {
  document.getElementById('exp-xls-btn')?.addEventListener('click', xlsFn);
  document.getElementById('exp-pdf-btn')?.addEventListener('click', pdfFn);
}

function xlDownload(wb, filename) { XLSX.writeFile(wb, filename + '.xlsx'); showToast('Excel downloaded!'); }

function exportAttendanceXLS() {
  const rows = globalData.attendance.map(a => ({'Date':a.date,'Worker':a.workerName,'Status':a.status,'Supervisor':a.supervisor,'Team':'Team '+a.team}));
  if (!rows.length) { alert('No records found.'); return; }
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.json_to_sheet(rows);
  XLSX.utils.book_append_sheet(wb, ws, 'Attendance');
  xlDownload(wb, 'Attendance_'+today());
}

function exportProductionXLS() {
  const rows = globalData.worklog.map(l => ({'Date':l.date,'Worker':l.workerName,'Task':l.task,'Units Done':l.units,'Hours Worked':l.hours,'Notes':l.notes||'','Supervisor':l.supervisor,'Team':'Team '+l.team}));
  if (!rows.length) { alert('No structural entry data log records.'); return; }
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.json_to_sheet(rows);
  XLSX.utils.book_append_sheet(wb, ws, 'Production');
  xlDownload(wb, 'Production_'+today());
}

function exportInventoryXLS() {

  const stockRows = globalData.inventory.map(i => ({'Item':i.item,'Current Stock':i.stock,'Unit':i.unit,'Min Level':i.minLevel,'Total Used':usageMap[i.item]||0}));
  const ws1 = XLSX.utils.json_to_sheet(stockRows);
  XLSX.utils.book_append_sheet(wb, ws1, 'Stocks');
  xlDownload(wb, 'Inventory_'+today());
}

function exportQueriesXLS() {

  if (!rows.length) { alert('No query objects found.'); return; }

function pdfHeader(doc, title, sub) {
  doc.setFillColor(22,27,39); doc.rect(0,0,210,28,'F');
  doc.setTextColor(79,142,247); doc.setFontSize(14); doc.setFont('helvetica','bold'); doc.text('WorkTrack',14,12);
  doc.setTextColor(232,234,240); doc.setFontSize(13); doc.setFont('helvetica','bold'); doc.text(title,14,38);
  return 52;
}

function pdfTable(doc, startY, head, body) {
  doc.autoTable({
    startY, head:[head], body, theme: 'grid',
    headStyles: { fillColor:[30,37,53], textColor:[139,144,160] },
    bodyStyles: { textColor:[180,185,200] },
  });
}

// ===================== SUPERVISOR RUNTIME PANELS =====================
function renderAttendance() {
  const myWorkers = globalData.workers.filter(w => w.team === currentUser.team);
  const todayRec = globalData.attendance.filter(a => a.date === today() && a.supervisor === currentUser.name);
  const marked = {};
  todayRec.forEach(a => marked[a.workerId] = a.status);

  let workersHtml = '';
  myWorkers.forEach((w,i) => {
    const status = marked[w.id] || '';
    const statusBadge = status === 'Present' ? `<span class="badge badge-green">Present</span>` :
      status === 'Absent' ? `<span class="badge badge-red">Absent</span>` :
      status === 'Half Day' ? `<span class="badge badge-amber">Half Day</span>` :
      `<span class="badge badge-gray">Unmarked</span>`;
    workersHtml += `
    <div class="att-worker">
      <div class="att-avatar" style="background:${avatarColor(i)}">${w.name.split(' ').map(x=>x[0]).join('').slice(0,2)}</div>
      <div style="flex:1;min-width:0"><div class="att-name">${w.name}</div><div class="att-status">${statusBadge}</div></div>
    </div>`;
  });

  setContent(`
    <div class="page active">
      <div class="page-title">Attendance Logging</div>
      <div class="page-sub">Team ${currentUser.team} Dashboard</div>
      ${exportBtn('exportAttendanceXLS','exportAttendancePDF')}
      <div class="card">
        <div class="card-title"><span class="ct-icon">✅</span>Mark Today</div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:14px">${workersHtml || '<div class="empty-state">No active workers found.</div>'}</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          ${myWorkers.map(w=>`
          <div style="display:flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px;min-width:200px;flex:1">
            <span style="font-size:12px;color:var(--text2);min-width:80px;font-weight:500">${w.name.split(' ')[0]}</span>
            <select class="att-selector" data-workerid="${w.id}" style="flex:1;background:var(--bg);border:1px solid var(--border2);border-radius:7px;padding:5px 8px;color:var(--text);font-size:12px;">
              <option value="">--</option>
              <option value="Present" ${marked[w.id]==='Present'?'selected':''}>Present</option>
              <option value="Absent" ${marked[w.id]==='Absent'?'selected':''}>Absent</option>
              <option value="Half Day" ${marked[w.id]==='Half Day'?'selected':''}>Half Day</option>
            </select>
          </div>`).join('')}
        </div>
      </div>
      <div class="card">
        <div class="card-title"><span class="ct-icon">📅</span>Recent Logs</div>
        ${renderAttTable()}
      </div>
    </div>`);

  bindExportClicks(exportAttendanceXLS, exportAttendancePDF);
  document.querySelectorAll('.att-selector').forEach(sel => {
    sel.addEventListener('change', (e) => markAtt(e.target.dataset.workerid, e.target.value));
  });
}

async function markAtt(workerId, status) {
  if (!status) return;
  const existing = globalData.attendance.findIndex(a => a.date===today() && a.workerId===workerId && a.supervisor===currentUser.name);
  const worker = globalData.workers.find(w=>w.id===workerId);
  const rec = {date:today(),workerId,workerName:worker?.name||'',status,supervisor:currentUser.name,team:currentUser.team};
  if (existing >= 0) globalData.attendance[existing] = rec; else globalData.attendance.push(rec);
  await writeDataToFirebase();
  showToast(`${worker?.name} synchronized`);
}

function renderAttTable() {
  const recs = globalData.attendance.filter(a=>a.supervisor===currentUser.name).slice(-15).reverse();
  if (!recs.length) return '<div class="empty-state">No structural record objects stored yet.</div>';
  return `<table class="data-table"><thead><tr><th>Date</th><th>Worker</th><th>Status</th></tr></thead><tbody>
    ${recs.map(r=>`<tr><td>${fmtDate(r.date)}</td><td>${r.workerName}</td><td><span class="badge ${r.status==='Present'?'badge-green':r.status==='Absent'?'badge-red':'badge-amber'}">${r.status}</span></td></tr>`).join('')}
  </tbody></table>`;
}

        </tbody></table>` : '<div class="empty-state">No tracking units entered yet.</div>'}

async function saveWorklog() {
  const wv = document.getElementById('wl-worker').value;
  const task = document.getElementById('wl-task').value;
  const units = document.getElementById('wl-units').value;
  const hours = document.getElementById('wl-hours').value;
  const notes = document.getElementById('wl-notes').value;
  if (!wv || !task || !units) { alert('Please complete required form properties.'); return; }
  const [wId, wName] = wv.split(':');
  globalData.worklog.push({date:today(),workerId:wId,workerName:wName,task,units:Number(units),hours:Number(hours)||0,notes,supervisor:currentUser.name,team:currentUser.team});
  await writeDataToFirebase();
  showToast('Production metrics synchronized.');
  renderWorklog();
}

function renderInvUse() {
  const lowItems = globalData.inventory.filter(i=>i.stock<=i.minLevel);
  let alertHtml = lowItems.map(i=>`<div class="alert-row">⚠️ <span><strong>${i.item}</strong> allocation critical: <strong>${i.stock} ${i.unit}</strong> remaining.</span></div>`).join('');
  setContent(`
    <div class="page active">
      <div class="page-title">Operational Inventory Control</div>
      ${exportBtn('exportInventoryXLS','exportInventoryPDF')}
      ${alertHtml}
      <div class="card">

        <div class="form-row">
          <div class="field"><label>MATERIAL ASSET</label>
            <select id="iu-item"><option value="">Select item</option>${globalData.inventory.map(i=>`<option value="${i.id}">${i.item} (${i.stock} ${i.unit})</option>`).join('')}</select>
          </div>
          <div class="field"><label>QUANTITY DEDUCTION</label><input type="number" id="iu-qty" min="0"></div>
          <div class="field"><label>PURPOSE/SECTION</label><input type="text" id="iu-purpose"></div>
        </div>
        <button class="btn-save" id="iu-save-btn">Process Asset Deduction</button>
      </div>
    </div>`);

  bindExportClicks(exportInventoryXLS, exportInventoryPDF);
  document.getElementById('iu-save-btn').addEventListener('click', saveInvUse);
}

async function saveInvUse() {
  const itemId = document.getElementById('iu-item').value;
  const qty = Number(document.getElementById('iu-qty').value);
  const purpose = document.getElementById('iu-purpose').value;
  if (!itemId || !qty) return alert('Invalid inputs matrix');
  const inv = globalData.inventory.find(i=>i.id===itemId);
  if (!inv || qty > inv.stock) return alert('Stock verification bounds failed.');
  inv.stock -= qty;
  globalData.inventory_usage.push({date:today(),itemId,itemName:inv.item,qty,purpose,supervisor:currentUser.name,team:currentUser.team});
  await writeDataToFirebase();
  showToast('Stocks auto-deducted successfully');
  renderInvUse();
}
